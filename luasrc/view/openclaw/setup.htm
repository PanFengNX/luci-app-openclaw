<%+header%>
<style>
/* ===== OpenClaw 统一视图样式（10 个视图共用，逐字节一致） =====
 * 中性色用半透明 rgba(127,127,127,α)，随底色自动明暗；前景弱化色用相对
 * currentColor 的混色（深色主题自动变浅、浅色主题自动变深），保证 WCAG AA；
 * 不支持 color-mix 的浏览器回退到按浅色主题标定的十六进制值。
 * 强调色（蓝/绿/橙/红）用固定十六进制，明暗底上都有足够对比度。
 *
 * 版式：卡片最大宽度 940px，标签列固定 116px，控件最大宽度受限（不再拉满整行），
 * 行内动作按钮一律降为次要样式 —— 一屏里不该出现五六个同等权重的实心蓝按钮。 */
:root{
  /* 兜底：不支持 color-mix 的浏览器按浅色主题取可读值 */
  --oc-fg-dim:#4a4f57;
  --oc-fg-mute:#5f6670;
  /* 支持时跟随主题文字色 */
  --oc-fg-dim:color-mix(in srgb, currentColor 82%, transparent);
  --oc-fg-mute:color-mix(in srgb, currentColor 72%, transparent);
  --oc-line:rgba(127,127,127,.26);--oc-line-soft:rgba(127,127,127,.13);
  --oc-surface:rgba(127,127,127,.055);--oc-surface-2:rgba(127,127,127,.10);
  --oc-accent:#5563d2;--oc-ok:#1f6b2c;--oc-warn:#c05621;--oc-err:#cc2222;
  --oc-r:12px;--oc-r-sm:8px;--oc-label:116px;}

/* ── 卡片 ───────────────────────────────────────────────────────── */
.oc-card{max-width:940px;box-sizing:border-box;border:1px solid var(--oc-line-soft);
  border-radius:var(--oc-r);background:var(--oc-surface);padding:18px 20px 20px;
  margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px -18px rgba(0,0,0,.16)}
.oc-card h3{margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid var(--oc-line-soft);
  font-size:14px;font-weight:600;letter-spacing:.02em;line-height:1.45}
.oc-card>h3:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}

/* 卡片头：标题 + 右侧标签/按钮 */
.oc-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;
  padding:0 0 10px;border-bottom:1px solid var(--oc-line-soft)}
.oc-head h3{flex:1 1 auto;margin:0;padding:0;border:0;min-width:0}
.oc-head .oc-tag:first-of-type{margin-left:auto}

/* ── 分组标题：短竖条 + 小字，和字段标签明确区分开 ──────────────── */
.oc-sub{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:12px;
  font-weight:600;letter-spacing:.06em;color:var(--oc-fg-mute)}
.oc-sub::before{content:"";flex:0 0 3px;width:3px;height:12px;border-radius:2px;
  background:var(--oc-accent);opacity:.8}
.oc-card>.oc-sub:first-of-type,.oc-card>.oc-hint:first-of-type{margin-top:0}

/* ── 多列容器 ───────────────────────────────────────────────────── */
.oc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:0 16px;align-items:start;max-width:940px}

/* ── 键值区：标签定宽 + 值紧跟其后（不再把值甩到行尾） ──────────── */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 28px}
.oc-kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--oc-line-soft);font-size:13px;line-height:1.5;
  font-variant-numeric:tabular-nums}
.oc-kv>b{min-width:0;margin:0;font-size:12.5px;font-weight:400;color:var(--oc-fg-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-kv>span{justify-self:start;text-align:left;word-break:break-word;min-width:0}

/* 在 .oc-grid 里跨满整行（值很长、又不属于某一边的键值对用） */
.oc-kv.oc-span{grid-column:1 / -1}

/* ── 概览数字条：标签在上、数值在下，列间竖线分隔 ───────────────── */
.oc-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;
  padding:2px 0 16px;margin:0 0 4px;border-bottom:1px solid var(--oc-line-soft)}
.oc-kpi{display:flex;flex-direction:column-reverse;gap:7px;align-items:flex-start;min-width:0;
  padding:0 18px;border-left:1px solid var(--oc-line-soft);font-size:17px;font-weight:600;
  line-height:1.25;font-variant-numeric:tabular-nums}
.oc-kpi:first-child{padding-left:0;border-left:0}
.oc-kpi-label,.oc-kpi .oc-kpi-label{margin:0;font-size:11.5px;font-weight:400;
  letter-spacing:.06em;color:var(--oc-fg-mute)}

/* ── 徽章 / 药丸 ────────────────────────────────────────────────── */
.oc-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;
  font-size:12px;font-weight:500;white-space:nowrap;vertical-align:middle}
.oc-badge::before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.oc-run{background:rgba(31,107,44,.12);color:var(--oc-ok)}
.oc-stop{background:rgba(127,127,127,.14);color:var(--oc-fg-dim)}
.oc-none{background:rgba(192,86,33,.12);color:var(--oc-warn)}
.oc-pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;background:rgba(85,99,210,.10);color:var(--oc-accent);
  border:1px solid rgba(85,99,210,.18);line-height:1.6;vertical-align:middle;white-space:nowrap}
.oc-pill.ok{background:rgba(31,107,44,.12);color:var(--oc-ok);border-color:rgba(31,107,44,.28)}
.oc-pill.warn{background:rgba(192,86,33,.12);color:var(--oc-warn);border-color:rgba(192,86,33,.28)}
.oc-pill.accent{background:rgba(85,99,210,.12);color:var(--oc-accent);border-color:rgba(85,99,210,.26)}
.oc-tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;
  background:var(--oc-surface-2);color:var(--oc-fg-dim);white-space:nowrap;vertical-align:middle}
.oc-tag.ok{color:var(--oc-ok)}
.oc-tag.warn{color:var(--oc-warn)}
.oc-tag.off{color:var(--oc-fg-mute)}

/* ── 控制台 / 输出 ─────────────────────────────────────────────── */
.oc-log{background:#1b1b1b;color:#e6e6e6;border-radius:var(--oc-r-sm);padding:12px 14px;
  height:280px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  line-height:1.6;white-space:pre-wrap}
.oc-log::-webkit-scrollbar{width:10px;height:10px}
.oc-log::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:6px}
.oc-log::-webkit-scrollbar-track{background:transparent}
.oc-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;
  background:var(--oc-surface-2);border-radius:var(--oc-r-sm);padding:10px 12px;
  max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-variant-numeric:tabular-nums}

/* ── 表单行：标签定宽，控件限宽，提示独占一行 ───────────────────── */
.oc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
.oc-row>label{flex:0 0 var(--oc-label);width:var(--oc-label);font-size:12.5px;
  color:var(--oc-fg-dim);line-height:1.5}
.oc-row>input[type=text],.oc-row>input[type=password]{flex:1 1 220px;min-width:0;max-width:440px}
.oc-row>input[type=number]{flex:0 0 96px;max-width:96px}
.oc-row>input[type=time]{flex:0 0 132px;max-width:132px}
.oc-row>input[type=file]{flex:0 1 320px;min-width:0}
.oc-row>select{flex:1 1 180px;min-width:0;max-width:320px}
.oc-row>select+select{flex:0 1 150px;max-width:150px}
.oc-row>input[type=checkbox],.oc-row>input[type=radio]{flex:0 0 auto;margin:0}
/* 提示换行到控件下方，与控件左边缘对齐：否则它会和按钮抢同一行，
   把「上传并恢复」这类按钮挤到下一行单独成行。 */
.oc-row>.oc-hint{flex:0 0 auto;box-sizing:border-box;margin:0 0 0 calc(var(--oc-label) + 12px);
  width:calc(100% - var(--oc-label) - 12px)}
/* 定宽行：标签 | 药丸 | 控件 | 右侧按钮。四列各占固定轨道，
   两行的输入框与按钮因此左右都对齐（版本升级那两行就是靠这个）。 */
.oc-row-fixed{display:grid;grid-template-columns:var(--oc-label) 190px minmax(0,1fr) auto;
  align-items:center;gap:8px 12px;margin:0 0 12px}
.oc-row-fixed>label{width:auto}
.oc-row-fixed>input[type=text],.oc-row-fixed>input[type=password],
.oc-row-fixed>select{width:100%;max-width:none;min-width:0}
.oc-row-fixed>.oc-pill{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.oc-row-fixed>button,.oc-row-fixed>.oc-btn{justify-self:end;min-width:76px;text-align:center}
.oc-row-fixed>.oc-hint{grid-column:2 / -1;width:auto;margin:0}
/* 版本选择器：外层容器当网格项，里面是下拉或手填框（二者互斥显示） */
.oc-row-fixed>.oc-pick{min-width:0}
.oc-pick{display:block;min-width:0}
.oc-pick>select,.oc-pick>input[type=text]{width:100%;max-width:none;min-width:0}

/* 行内横向组合（输入框 + 复制按钮等） */
.oc-inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.oc-inline>input[type=text],.oc-inline>input[type=password],.oc-inline>.oc-addr{flex:1 1 220px;min-width:0}

/* ── 非卡片内的地址 / 路径行 ───────────────────────────────────── */
.oc-rowline{display:grid;grid-template-columns:var(--oc-label) minmax(0,1fr);gap:12px;
  align-items:center;padding:8px 0;border-bottom:1px solid var(--oc-line-soft);min-height:38px}
.oc-rowline:last-child{border-bottom:0}
.oc-rowline>span:first-child{color:var(--oc-fg-mute);font-size:12.5px;white-space:nowrap}
.oc-rowline>span:last-child{text-align:left;min-width:0;word-break:break-word}

/* ── 提示与语义文字 ────────────────────────────────────────────── */
.oc-hint{font-size:12px;line-height:1.75;color:var(--oc-fg-mute);margin:6px 0;max-width:940px}
.oc-note{border-left:2px solid var(--oc-accent);background:var(--oc-surface-2);
  border-radius:0 var(--oc-r-sm) var(--oc-r-sm) 0;padding:10px 14px;font-size:12px;
  line-height:1.75;color:var(--oc-fg-dim);margin:8px 0 0}
.oc-note p{margin:0 0 6px}
.oc-note p:last-child{margin:0}
.oc-warn{color:var(--oc-warn)}
.oc-ok{color:var(--oc-ok)}
.oc-err{color:var(--oc-err);font-size:12px;line-height:1.7}

/* ── 按钮 ─────────────────────────────────────────────────────── */
button,.oc-btn{border:1px solid transparent;border-radius:var(--oc-r-sm);padding:6px 14px;
  font-size:13px;font-weight:500;font-family:inherit;background:var(--oc-accent);color:#fff;
  cursor:pointer;min-height:32px;line-height:1.35;box-sizing:border-box;
  transition:filter .12s,background .12s,color .12s}
button:hover,.oc-btn:hover{filter:brightness(.94)}
button:focus-visible,.oc-btn:focus-visible{outline:2px solid var(--oc-accent);outline-offset:2px}
.oc-btn.gray{background:#6c757d}
.oc-btn.green{background:var(--oc-ok)}
.oc-btn.danger{background:var(--oc-err)}
.oc-btn.ghost{background:transparent;border-color:var(--oc-line);color:inherit}
.oc-btn.ghost:hover{background:var(--oc-surface-2);filter:none}
button:disabled,.oc-btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
button:disabled:hover,.oc-btn:disabled:hover{filter:none}
.oc-btn.ghost:disabled{background:transparent;border-color:var(--oc-line-soft);
  color:var(--oc-fg-mute);opacity:.55}
.oc-btn.ghost:disabled:hover{filter:none}
#btn-open:disabled{background:var(--oc-line);color:var(--oc-fg-mute)}
/* 紧贴输入框的行内按钮、以及操作条里第二个之后的按钮，一律降为次要样式 */
.oc-row button,.oc-row .oc-btn,.oc-rowline button,.oc-rowline .oc-btn,
.oc-actions button+button:not(.ghost):not(.green):not(.danger):not(.gray){
  background:var(--oc-surface-2);border-color:var(--oc-line);color:inherit}
.oc-row button:hover,.oc-row .oc-btn:hover,.oc-rowline button:hover,.oc-rowline .oc-btn:hover,
.oc-actions button+button:not(.ghost):not(.green):not(.danger):not(.gray):hover{
  background:var(--oc-line-soft);filter:none}
.oc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 0}
.oc-actions button,.oc-actions .oc-btn,.oc-actions label{margin:0}
.oc-actions>.oc-hint{margin:0;flex:0 1 auto;max-width:none}

/* ── 表单控件 ─────────────────────────────────────────────────── */
select,input[type=text],input[type=password],input[type=number],input[type=time],
input[type=file],textarea{border:1px solid var(--oc-line);border-radius:var(--oc-r-sm);
  background:var(--oc-surface);padding:0 10px;font-size:13px;font-family:inherit;
  height:32px;min-height:32px;line-height:1.4;color:inherit;box-sizing:border-box;max-width:100%}
textarea{height:auto;padding:8px 10px;line-height:1.6}
input[type=file]{height:auto;min-height:32px;padding:4px 8px;font-size:12px;line-height:1.6}
input[type=checkbox]{width:15px;height:15px;min-height:0;padding:0;margin:0;
  accent-color:var(--oc-accent);vertical-align:-2px;border-radius:3px}
select:focus,input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,
input[type=time]:focus,textarea:focus{border-color:var(--oc-accent);outline:none;
  box-shadow:0 0 0 3px rgba(85,99,210,.14)}
input.oc-addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  background:var(--oc-surface-2);min-width:0}

/* ── 空状态 / 复制按钮 ────────────────────────────────────────── */
.oc-empty{padding:22px 16px;text-align:center;border:1px dashed var(--oc-line);
  border-radius:var(--oc-r);color:var(--oc-fg-mute);font-size:12.5px;background:transparent}
.oc-copy{padding:3px 10px;font-size:12px;border-radius:var(--oc-r-sm);background:transparent;
  color:var(--oc-accent);border:1px solid var(--oc-line);cursor:pointer;margin:0;min-height:28px}
.oc-copy:hover{background:var(--oc-surface-2);filter:none}

/* ── 说明列表 ─────────────────────────────────────────────────── */
.oc-list{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.75;color:var(--oc-fg-mute)}
.oc-list>li{position:relative;padding-left:14px;margin:0 0 7px}
.oc-list>li:last-child{margin-bottom:0}
.oc-list>li::before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;
  border-radius:50%;background:var(--oc-accent);opacity:.55}

/* ── 窄屏 ─────────────────────────────────────────────────────── */
@media (max-width:640px){
  .oc-card{padding:16px 14px}
  .oc-row>label{flex:0 0 100%;width:auto}
  .oc-row>input[type=text],.oc-row>input[type=password],.oc-row>select{flex:1 1 100%;max-width:none}
  .oc-row-fixed{grid-template-columns:minmax(0,1fr)}
  .oc-row-fixed>label,.oc-row-fixed>.oc-pill,.oc-row-fixed>button,.oc-row-fixed>.oc-btn,
  .oc-row-fixed>.oc-hint{grid-column:1 / -1;justify-self:start;width:auto;margin:0}
  .oc-row>.oc-hint{margin-left:0;width:100%}
  .oc-cols{grid-template-columns:1fr}
  .oc-kv{grid-template-columns:92px minmax(0,1fr)}
  .oc-kpi{padding:0 12px}
  .oc-rowline{flex-wrap:wrap}
  .oc-rowline>span:last-child{text-align:left}
}
</style>

<h2><a id="content" name="content">OpenClaw 助手 · 基本设置</a></h2>

<div class="oc-card">
  <h3>基本设置</h3>

  <div class="oc-sub">运行环境</div>
  <div class="oc-row">
    <label>安装目录</label>
    <select id="in-dir"></select>
    <input type="text" id="in-dir-custom" placeholder="或手动输入目录，如 /mnt/nvme0n1-3/Configs/OpenClaw">
  </div>
  <div class="oc-hint" id="in-dir-hint">
    <div id="in-dir-warn" class="oc-err" style="display:none;margin-bottom:4px"></div>
    建议选数据盘挂载点下的目录，例如 /mnt/&lt;磁盘&gt;/OpenClaw；不要选 /overlay、/rom 等系统分区。
  </div>

  <div class="oc-row" style="margin-top:10px">
    <label>程序位置</label>
    <input type="text" id="in-ocdir-shown" class="oc-addr" readonly>
    <button id="btn-ocdir-reset" class="oc-btn ghost" style="display:none">恢复默认</button>
  </div>
  <div class="oc-hint" id="in-ocdir-hint">
    <div id="in-ocdir-warn" class="oc-err" style="display:none;margin-bottom:4px"></div>
    OpenClaw 程序本体固定装在 &lt;安装目录&gt;/openclaw，与数据分开存放 —— 卸载时只删程序、保留会话与凭据。
    <div style="font-size:12px;margin-top:2px">需要把程序与数据分开存放时，请在 SSH 里 uci set openclaw.main.openclaw_dir=... 后重新安装。</div>
    <div id="in-ocdir-msg" class="oc-ok" style="display:none;margin-top:4px"></div>
  </div>

  <div class="oc-row" style="margin-top:14px">
    <label>OpenClaw 版本</label>
    <select id="in-oc"></select>
    <button id="btn-reload-versions" class="oc-btn ghost">重新获取版本</button>
  </div>
  <div class="oc-hint" id="in-engines">在线获取中…</div>

  <div class="oc-row" style="margin-top:14px">
    <label>Node.js 版本</label>
    <select id="in-node"></select>
  </div>
  <div class="oc-hint" id="in-node-hint"></div>

  <div class="oc-sub">网关</div>
  <div class="oc-row"><label>网关端口</label><input type="text" id="cfg-port"></div>
  <div class="oc-row"><label>绑定模式</label>
    <select id="cfg-bind">
      <option value="loopback">loopback（仅本机）</option>
      <option value="lan">lan（局域网，默认）</option>
      <option value="auto">auto</option>
      <option value="tailnet">tailnet</option>
      <option value="custom">custom</option>
    </select>
  </div>
  <div class="oc-row"><label>开机自启</label>
    <select id="cfg-enabled"><option value="1">启用</option><option value="0">禁用</option></select>
  </div>
  <div class="oc-actions"><button id="btn-save">保存并应用</button></div>
</div>

<script>
var API = {
  info: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","info")%>',
  versions: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","versions")%>',
  check: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","check")%>',
  install: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","install")%>',
  istatus: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","istatus")%>',
  ilog: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","ilog")%>',
  service: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","service")%>',
  save: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","save")%>',
  mounts: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","mounts")%>',
  discover: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","discover")%>',
  node_existing: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","node_existing")%>',
  migrate: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","migrate")%>',
  doctor: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","doctor")%>',
  repair: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","repair")%>',
  diag_run: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_run")%>',
  diag_poll: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_poll")%>',
  backups: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backups")%>',
  backup_create: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_create")%>',
  backup_verify: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_verify")%>',
  backup_delete: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_delete")%>',
  backup_upload: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_upload")%>',
  backup_download: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_download")%>',
  restore: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","restore")%>'
};
var state = { info:null, ocList:[], nodeList:[], engines:'',
  // ocdirCustom：服务端当前保存的自定义程序目录（main.openclaw_dir），空串 = 默认
  // <安装目录>/openclaw。程序目录不再由用户在页面上编辑，但必须原样回传给
  // save —— 否则会把 SSH 或迁移流程设置的值冲掉。
  ocdirCustom: '',
  // ocdirLoaded：info 是否已经回填过。save 对 openclaw_dir 是"空值也显式写入"
  // 的语义，info 还没回来就提交会把服务端的自定义程序目录误清成默认。
  ocdirLoaded: false };

// 版本下拉是否被用户显式改过：api_info 不返回 UCI 里保存的 oc_version /
// node_version，页面无法回填。若保存时无条件提交下拉值（默认落在 latest），
// 用户只改端口也会把已保存的版本号悄悄覆盖掉。所以只在改动过时才提交。
var versionTouched = { oc:false, node:false };

function $(id){ return document.getElementById(id); }
// 回调只允许触发一次：readyState==4 与 onerror 在某些浏览器上会同时到达，
// 没有这个守卫时同一次请求会把按钮禁用/恢复跑两遍。
function once(cb){
  var done = false;
  return function(v){ if (done) return; done = true; cb(v); };
}
function post(url, data, cb){
  var body = [];
  for (var k in data) body.push(encodeURIComponent(k)+'='+encodeURIComponent(data[k]));
  var x = new XMLHttpRequest();
  x.open('POST', url, true);
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  var fin = once(cb);
  x.onreadystatechange = function(){
    if (x.readyState == 4) { try { fin(JSON.parse(x.responseText)); } catch(e){ fin({ok:false}); } }
  };
  // 连接被重置 / 请求超时：readyState 可能根本不到 4，回调就永远不来，
  // 发起方会永久卡在 disabled。用 net:true 标记，让调用方知道"这次没拿到数据"。
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  // 有界等待：保存/迁移是分钟级操作。
  x.timeout = 900000;
  x.send(body.join('&'));
}
function get(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  var fin = once(cb);
  x.onreadystatechange = function(){ if (x.readyState==4){ try{fin(JSON.parse(x.responseText));}catch(e){fin({ok:false});} } };
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  x.timeout = 20000;
  x.send();
}
function jp(s, fb){ try { return JSON.parse(s); } catch(e){ return fb; } }

// ------------------------------- 目录检查（只是提示，最终以后端校验为准）
// 后端 oc_validate_base_dir 还会解析符号链接、检查真实路径，这里只覆盖用户
// 最常撞到的两类误填：目录落在系统分区上、程序目录 == 安装目录（或它的上级）。
// 目的不是替代后端，而是在点"保存"之前就把"为什么不行、该怎么改"说清楚。
var OC_SYS_PREFIXES = [
  ['/bin','是系统程序目录'], ['/sbin','是系统程序目录'], ['/lib','是系统库目录'],
  ['/usr','是系统程序目录'], ['/etc','是系统配置目录'],
  ['/proc','是内核虚拟文件系统'], ['/sys','是内核虚拟文件系统'], ['/dev','是设备目录'],
  ['/run','是运行时临时目录'], ['/tmp','是内存临时目录（重启即清空）'],
  ['/var','是运行时数据目录'], ['/overlay','是根文件系统的 overlay（系统分区）'],
  ['/rom','是只读的固件分区'], ['/root','是 root 用户的主目录']
];

// 与后端一致：去掉首尾空白与尾部斜杠（"/" 本身保留）
function normDir(p){
  p = String(p || '').replace(/^\s+|\s+$/g, '');
  while (p.length > 1 && p.charAt(p.length-1) === '/') p = p.slice(0, -1);
  return p;
}

// 返回不适合放应用数据的原因；空字符串 = 这一层看不出问题
function dirProblem(p){
  p = normDir(p);
  if (!p) return '';
  if (p.charAt(0) !== '/') return '请填写以 / 开头的绝对路径。';
  if (p === '/') return '根目录是系统分区，不能放应用数据。';
  // 与后端 oc_validate_base_dir_shape 一致：不允许 . / .. 段（后端还会解析符号链接）
  if (/(^|\/)\.\.?(\/|$)/.test(p)) return '路径不能包含 . 或 .. 段，请填写规范化后的绝对路径。';
  for (var i = 0; i < OC_SYS_PREFIXES.length; i++){
    var pre = OC_SYS_PREFIXES[i][0];
    if (p !== pre && p.indexOf(pre + '/') !== 0) continue;
    if (pre === '/overlay')
      return '/overlay 是系统分区（根文件系统的 overlay），容量有限且与系统配置混在一起，不适合放应用数据。'
           + '请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
    if (pre === '/rom')
      return '/rom 是只读的固件分区，无法写入。请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
    return pre + ' ' + OC_SYS_PREFIXES[i][1] + '，不能放应用数据。'
         + '请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
  }
  return '';
}

// 程序目录的冲突检查：留空 = 默认 <安装目录>/openclaw，永远安全
function ocDirProblem(base, ocdir){
  base = normDir(base); ocdir = normDir(ocdir);
  if (!ocdir) return '';
  var p = dirProblem(ocdir);
  if (p) return p;
  if (base && ocdir === base)
    return '程序目录不能等于安装目录（' + base + '）：那样卸载时会连带删除数据（会话 / 工作区）。'
         + '留空即可 —— 程序会自动装到 ' + base + '/openclaw。';
  if (base && base.indexOf(ocdir + '/') === 0)
    return '程序目录不能是安装目录的上级（' + ocdir + ' 包含 ' + base + '）：'
         + '卸载时会连同安装目录（含数据）一起删除。留空即可 —— 程序会自动装到 '
         + base + '/openclaw。';
  return '';
}

function setHint(id, msg){
  var el = $(id);
  if (!el) return;
  el.textContent = msg || '';            // 服务端数据 / 用户输入只进 textContent
  el.style.display = msg ? '' : 'none';
}

function currentDirs(){
  return {
    base:  normDir($('in-dir-custom').value || $('in-dir').value),
    // 程序目录只来自服务端（SSH / 迁移已有安装写入的 UCI），页面上没有输入框
    ocdir: normDir(state.ocdirCustom)
  };
}

// 只读展示「程序位置」：默认 <安装目录>/openclaw；服务端保存过自定义值时显示它。
// 自定义值可能是 SSH 里手工设错的，所以照样过一遍 ocDirProblem() 给出告警。
function renderOcdir(){
  var base = normDir($('in-dir-custom').value || $('in-dir').value);
  var ocdir = normDir(state.ocdirCustom);
  var shown = ocdir || (base ? base + '/openclaw' : '');
  $('in-ocdir-shown').value = shown;      // 服务端数据只进 input.value
  $('btn-ocdir-reset').style.display = ocdir ? '' : 'none';
  setHint('in-ocdir-msg', '');            // 目录一变，上一次「已恢复默认」的提示就过期了
  setHint('in-ocdir-warn', ocDirProblem(base, ocdir));
}

// 刷新两条 hint，并把本次检查结果返回给调用方（提交前拦截用）
function dirCheck(){
  var d = currentDirs();
  var baseMsg = dirProblem(d.base);
  var ocMsg   = ocDirProblem(d.base, d.ocdir);
  setHint('in-dir-warn', baseMsg);
  setHint('in-ocdir-warn', ocMsg);
  return { base: baseMsg, ocdir: ocMsg, dirs: d };
}

// 设置页只回填设置相关控件；状态卡的元素在 openclaw/status 页面。
function loadInfo(){
  get(API.info, function(r){
    var d = jp(r.data||'{}', {});
    state.info = d;
    $('cfg-port').value = d.port||'18789';
    $('cfg-bind').value = d.bind||'lan';
    if (d.base_dir && !$('in-dir-custom').value) $('in-dir-custom').value = d.base_dir;
    // 程序目录是服务端状态：oc_dir_custom 为假表示用默认（<安装目录>/openclaw）
    state.ocdirCustom = d.oc_dir_custom ? (d.openclaw_dir || '') : '';
    state.ocdirLoaded = true;
    // 回填后的目录组合也要立刻检查一次（刷新 / 保存后不会残留旧的红字）
    dirCheck();
    renderOcdir();
  });
}

function loadMounts(){
  get(API.mounts, function(r){
    var arr = jp(r.data||'[]', []);
    var sel = $('in-dir'), cur = $('in-dir-custom').value || (state.info && state.info.base_dir) || '';
    sel.innerHTML = '';
    arr.forEach(function(m){
      var o = document.createElement('option');
      o.value = m.path.replace(/\/$/,'') + '/OpenClaw';
      o.textContent = m.path + '  （可用 ' + m.free_mb + ' MB，' + m.dev + '）';
      if (cur && cur.indexOf(m.path) === 0) o.selected = true;
      sel.appendChild(o);
    });
    if (!arr.length){
      var o = document.createElement('option');
      o.value = '/mnt/data/OpenClaw'; o.textContent = '/mnt/data（未检测到外置盘）';
      sel.appendChild(o);
    }

    // 程序目录不再有下拉：它是内部实现细节，固定为 <安装目录>/openclaw
    // （需要分离存放时只能在 SSH 里写 UCI）。安装目录下拉重新生成后重新比对一次。
    dirCheck();
    renderOcdir();
  });
}

function engineOK(nodeNum, engines){
  // mirror of the shell engines_match: supports || and space separated comparators
  if (!engines) return true;
  var parts = engines.split('||');
  for (var i=0;i<parts.length;i++){
    var cmps = parts[i].trim().split(/\s+/), ok = true;
    for (var j=0;j<cmps.length;j++){
      var c = cmps[j]; if (!c) continue;
      if (!cmpOne(nodeNum, c)) { ok = false; break; }
    }
    if (ok) return true;
  }
  return false;
}
function fields(v){ var a=(v||'0.0.0').replace(/^v/,'').split('.'); for(var i=0;i<3;i++){ a[i]=parseInt((a[i]||'0').replace(/[^0-9].*$/,''),10)||0; } return a; }
function cmpOne(v, c){
  if (c===''||c==='*') return true;
  var op = c.match(/^(>=|<=|>|<|=|\^|~)/); op = op ? op[1] : '=';
  var cv = c.replace(/^(>=|<=|>|<|=|\^|~)/,'');
  var a = fields(v), b = fields(cv), raw = cv.split('.');
  for (var i=0;i<3;i++){
    if (raw[i]==='x'||raw[i]==='X'||raw[i]===undefined) break;
    if (a[i]!==b[i]){
      if (op==='>='||op==='>') return a[i]>b[i];
      if (op==='<='||op==='<') return a[i]<b[i];
      return false;
    }
  }
  if (op==='>'||op==='<') return false;
  return true;
}

// 本页选的版本要能带到「安装」页：api_info 只返回已安装的版本，不返回 UCI 里
// 保存的 oc_version / node_version，安装页读不到这里的选择。用 sessionStorage
// （同一标签页内有效）传一次，避免"选了版本、点安装却装了 latest"。
var PICK_KEY = 'openclaw.installPick';
function writePick(){
  try {
    window.sessionStorage.setItem(PICK_KEY,
      JSON.stringify({ oc: $('in-oc').value, node: $('in-node').value }));
  } catch(e){ /* 隐私模式 / 老浏览器：安装页会退回用已安装版本 */ }
}

function loadVersions(refresh){
  get(API.versions + (refresh ? '?refresh=1' : ''), function(r){
    var oc = jp(r.openclaw||'[]', []), nd = jp(r.node||'[]', []);
    state.ocList = oc; state.nodeList = nd;
    var src = jp(r.sources||'{}', {});
    $('in-engines').textContent = '数据源：npm ' + (src.npm||'') + '  |  node ' + (src.node||'') + '  |  ' + (src.arch||'') + (src.musl=='1'?' musl':' glibc');

    var sel = $('in-oc'); sel.innerHTML = '';
    var seen = {};
    oc.slice().reverse().forEach(function(v){
      if (seen[v.version]) return; seen[v.version] = 1;
      var o = document.createElement('option');
      o.value = v.version;
      o.textContent = v.version + (v.tag ? '  [' + v.tag + ']' : '') + '  (node ' + (v.engines||'any') + ')';
      if (v.tag === 'latest') o.selected = true;
      sel.appendChild(o);
    });
    if (!sel.options.length){
      var o = document.createElement('option'); o.value='latest'; o.textContent='latest（在线获取失败，将使用最新稳定版）'; sel.appendChild(o);
    }
    renderNodeOptions();
    // 状态页的「更新 Node」提示与「已有 Node」提示不在这里重绘：
    // 它们属于 openclaw/status 页面，由该页自己的版本请求负责。
  });
}

function currentEngines(){
  var v = $('in-oc').value, e = '';
  state.ocList.forEach(function(x){ if (x.version === v) e = x.engines || ''; });
  return e;
}

function renderNodeOptions(){
  var e = currentEngines();
  var sel = $('in-node'); sel.innerHTML = '';
  var prefer = null;
  state.nodeList.forEach(function(n){
    var ok = engineOK(n.num, e);
    var o = document.createElement('option');
    o.value = n.version;
    o.textContent = n.version + (n.lts ? '  [LTS ' + n.lts + ']' : '') + (ok ? '' : '  ✗ 低于要求 ' + e);
    if (!ok) { o.disabled = true; o.style.color = '#b00'; }
    else if (!prefer) prefer = o;
    sel.appendChild(o);
  });
  if (!sel.options.length){
    var o = document.createElement('option'); o.value='auto'; o.textContent='auto（自动选择满足要求的版本）'; sel.appendChild(o);
  } else if (prefer) { prefer.selected = true; }
  var auto = document.createElement('option'); auto.value='auto'; auto.textContent='auto（自动选择满足要求的最新版本）'; sel.insertBefore(auto, sel.firstChild);
  if (state.info && state.info.node) {
    for (var i=0;i<sel.options.length;i++){ if (sel.options[i].value.replace(/^v/,'v') === state.info.node) sel.options[i].selected = true; }
  }
  var hint = $('in-node-hint');
  hint.innerHTML = '';                       // e comes from the version feed
  hint.appendChild(document.createTextNode('OpenClaw ' + $('in-oc').value + ' 要求 Node.js：'));
  var hb = document.createElement('b'); hb.textContent = e || 'any'; hint.appendChild(hb);
  hint.appendChild(document.createTextNode('　低于该要求的版本已被禁用。'));
  writePick();                               // 版本下拉一确定就同步给「安装」页
}

$('in-oc').onchange = function(){ versionTouched.oc = true; renderNodeOptions(); };
$('in-node').onchange = function(){ versionTouched.node = true; writePick(); };
$('btn-reload-versions').onclick = function(){ $('in-engines').textContent='正在在线获取…'; loadVersions(true); };

// 保存并应用：网关参数 + 运行环境（安装目录 / 程序目录）。
// 安装已拆到「安装」页，那边只能读 info.base_dir：目录若在这里改了不保存，
// 安装页仍会按旧目录安装，所以 base_dir 必须一起提交。
// 版本只在用户显式改过下拉时才提交（见 versionTouched 的说明）。
$('btn-save').onclick = function(){
  var chk = dirCheck();
  if (chk.base || chk.ocdir){
    alert('无法保存：' + (chk.base || chk.ocdir));
    return;
  }
  var d = chk.dirs;
  var data = { port: $('cfg-port').value, bind: $('cfg-bind').value,
    enabled: $('cfg-enabled').value, base_dir: d.base };
  // info 未回填时不提交 openclaw_dir：空值会被服务端当成"恢复默认"。
  if (state.ocdirLoaded) data.openclaw_dir = d.ocdir;
  if (versionTouched.oc)   data.oc_version   = $('in-oc').value;
  if (versionTouched.node) data.node_version = $('in-node').value;
  post(API.save, data, function(r){
    if (!r || r.ok === false){
      alert('保存失败：' + ((r && (r.data || r.error)) || '服务无响应，请检查端口（1025-65535）后重试'));
      return;
    }
    writePick();
    alert('已保存');
    setTimeout(loadInfo, 2000);
  });
};
$('in-dir').onchange = function(){ $('in-dir-custom').value = $('in-dir').value; dirCheck(); renderOcdir(); };
// 安装目录变化时「程序位置」要跟着变：默认值 <安装目录>/openclaw 由它推导
$('in-dir-custom').oninput = function(){ dirCheck(); renderOcdir(); };

// 恢复默认：清掉内存里的自定义程序目录，保存时随请求回传空串
$('btn-ocdir-reset').onclick = function(){
  state.ocdirCustom = '';
  renderOcdir();
  var base = normDir($('in-dir-custom').value || $('in-dir').value);
  setHint('in-ocdir-msg', '已恢复默认，安装时会装到 ' + (base ? base + '/openclaw' : '<安装目录>/openclaw'));
};

loadInfo();
loadMounts();
loadVersions(false);
</script>
<%+footer%>
