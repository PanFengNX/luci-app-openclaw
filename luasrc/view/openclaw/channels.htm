<%+header%>
<style>
/* ===== OpenClaw 统一视图样式（10 个视图共用，逐字节一致） =====
 * 中性色用半透明 rgba(127,127,127,α)，随底色自动明暗；前景弱化色用相对
 * currentColor 的混色（深色主题自动变浅、浅色主题自动变深），保证 WCAG AA；
 * 不支持 color-mix 的浏览器回退到按浅色主题标定的十六进制值。
 * 强调色（蓝/绿/橙/红）用固定十六进制，明暗底上都有足够对比度。
 *
 * 版式：卡片最大宽度 940px，标签列固定 116px，控件最大宽度受限（不再拉满整行），
 * 行内动作按钮一律降为次要样式 —— 一屏里不该出现五六个同等权重的实心蓝按钮。 */
:root{
  /* 兜底：不支持 color-mix 的浏览器按浅色主题取可读值 */
  --oc-fg-dim:#4a4f57;
  --oc-fg-mute:#5f6670;
  /* 支持时跟随主题文字色 */
  --oc-fg-dim:color-mix(in srgb, currentColor 82%, transparent);
  --oc-fg-mute:color-mix(in srgb, currentColor 72%, transparent);
  --oc-line:rgba(127,127,127,.26);--oc-line-soft:rgba(127,127,127,.13);
  --oc-surface:rgba(127,127,127,.055);--oc-surface-2:rgba(127,127,127,.10);
  --oc-accent:#0a63bb;--oc-ok:#1f6b2c;--oc-warn:#c05621;--oc-err:#cc2222;
  --oc-r:12px;--oc-r-sm:8px;--oc-label:116px;}

/* ── 卡片 ───────────────────────────────────────────────────────── */
.oc-card{max-width:940px;box-sizing:border-box;border:1px solid var(--oc-line-soft);
  border-radius:var(--oc-r);background:var(--oc-surface);padding:18px 20px 20px;
  margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 28px -18px rgba(0,0,0,.16)}
.oc-card h3{margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid var(--oc-line-soft);
  font-size:14px;font-weight:600;letter-spacing:.02em;line-height:1.45}
.oc-card>h3:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}

/* 卡片头：标题 + 右侧标签/按钮 */
.oc-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;
  padding:0 0 10px;border-bottom:1px solid var(--oc-line-soft)}
.oc-head h3{flex:1 1 auto;margin:0;padding:0;border:0;min-width:0}
.oc-head .oc-tag:first-of-type{margin-left:auto}

/* ── 分组标题：短竖条 + 小字，和字段标签明确区分开 ──────────────── */
.oc-sub{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:12px;
  font-weight:600;letter-spacing:.06em;color:var(--oc-fg-mute)}
.oc-sub::before{content:"";flex:0 0 3px;width:3px;height:12px;border-radius:2px;
  background:var(--oc-accent);opacity:.8}
.oc-card>.oc-sub:first-of-type,.oc-card>.oc-hint:first-of-type{margin-top:0}

/* ── 多列容器 ───────────────────────────────────────────────────── */
.oc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:0 16px;align-items:start;max-width:940px}

/* ── 键值区：标签定宽 + 值紧跟其后（不再把值甩到行尾） ──────────── */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 28px}
.oc-kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--oc-line-soft);font-size:13px;line-height:1.5;
  font-variant-numeric:tabular-nums}
.oc-kv>b{min-width:0;margin:0;font-size:12.5px;font-weight:400;color:var(--oc-fg-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-kv>span{justify-self:start;text-align:left;word-break:break-word;min-width:0}

/* ── 概览数字条：标签在上、数值在下，列间竖线分隔 ───────────────── */
.oc-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;
  padding:2px 0 16px;margin:0 0 4px;border-bottom:1px solid var(--oc-line-soft)}
.oc-kpi{display:flex;flex-direction:column-reverse;gap:7px;align-items:flex-start;min-width:0;
  padding:0 18px;border-left:1px solid var(--oc-line-soft);font-size:17px;font-weight:600;
  line-height:1.25;font-variant-numeric:tabular-nums}
.oc-kpi:first-child{padding-left:0;border-left:0}
.oc-kpi-label,.oc-kpi .oc-kpi-label{margin:0;font-size:11.5px;font-weight:400;
  letter-spacing:.06em;color:var(--oc-fg-mute)}

/* ── 徽章 / 药丸 ────────────────────────────────────────────────── */
.oc-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;
  font-size:12px;font-weight:500;white-space:nowrap;vertical-align:middle}
.oc-badge::before{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:currentColor}
.oc-run{background:rgba(31,107,44,.12);color:var(--oc-ok)}
.oc-stop{background:rgba(127,127,127,.14);color:var(--oc-fg-dim)}
.oc-none{background:rgba(192,86,33,.12);color:var(--oc-warn)}
.oc-pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;background:rgba(10,99,187,.10);color:var(--oc-accent);
  border:1px solid rgba(10,99,187,.18);line-height:1.6;vertical-align:middle;white-space:nowrap}
.oc-pill.ok{background:rgba(31,107,44,.12);color:var(--oc-ok);border-color:rgba(31,107,44,.28)}
.oc-pill.warn{background:rgba(192,86,33,.12);color:var(--oc-warn);border-color:rgba(192,86,33,.28)}
.oc-pill.accent{background:rgba(10,99,187,.12);color:var(--oc-accent);border-color:rgba(10,99,187,.26)}
.oc-tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;
  background:var(--oc-surface-2);color:var(--oc-fg-dim);white-space:nowrap;vertical-align:middle}
.oc-tag.ok{color:var(--oc-ok)}
.oc-tag.warn{color:var(--oc-warn)}
.oc-tag.off{color:var(--oc-fg-mute)}

/* ── 控制台 / 输出 ─────────────────────────────────────────────── */
.oc-log{background:#1b1b1b;color:#e6e6e6;border-radius:var(--oc-r-sm);padding:12px 14px;
  height:280px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  line-height:1.6;white-space:pre-wrap}
.oc-log::-webkit-scrollbar{width:10px;height:10px}
.oc-log::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:6px}
.oc-log::-webkit-scrollbar-track{background:transparent}
.oc-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;
  background:var(--oc-surface-2);border-radius:var(--oc-r-sm);padding:10px 12px;
  max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-variant-numeric:tabular-nums}

/* ── 表单行：标签定宽，控件限宽，提示独占一行 ───────────────────── */
.oc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
.oc-row>label{flex:0 0 var(--oc-label);width:var(--oc-label);font-size:12.5px;
  color:var(--oc-fg-dim);line-height:1.5}
.oc-row>input[type=text],.oc-row>input[type=password]{flex:1 1 220px;min-width:0;max-width:440px}
.oc-row>input[type=number]{flex:0 0 96px;max-width:96px}
.oc-row>input[type=time]{flex:0 0 132px;max-width:132px}
.oc-row>input[type=file]{flex:0 1 320px;min-width:0}
.oc-row>select{flex:1 1 180px;min-width:0;max-width:320px}
.oc-row>select+select{flex:0 1 150px;max-width:150px}
.oc-row>input[type=checkbox],.oc-row>input[type=radio]{flex:0 0 auto;margin:0}
/* 提示换行到控件下方，与控件左边缘对齐：否则它会和按钮抢同一行，
   把「上传并恢复」这类按钮挤到下一行单独成行。 */
.oc-row>.oc-hint{flex:0 0 auto;box-sizing:border-box;margin:0 0 0 calc(var(--oc-label) + 12px);
  width:calc(100% - var(--oc-label) - 12px)}
/* 行内横向组合（输入框 + 复制按钮等） */
.oc-inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.oc-inline>input[type=text],.oc-inline>input[type=password],.oc-inline>.oc-addr{flex:1 1 220px;min-width:0}

/* ── 非卡片内的地址 / 路径行 ───────────────────────────────────── */
.oc-rowline{display:grid;grid-template-columns:var(--oc-label) minmax(0,1fr);gap:12px;
  align-items:center;padding:8px 0;border-bottom:1px solid var(--oc-line-soft);min-height:38px}
.oc-rowline:last-child{border-bottom:0}
.oc-rowline>span:first-child{color:var(--oc-fg-mute);font-size:12.5px;white-space:nowrap}
.oc-rowline>span:last-child{text-align:left;min-width:0;word-break:break-word}

/* ── 提示与语义文字 ────────────────────────────────────────────── */
.oc-hint{font-size:12px;line-height:1.75;color:var(--oc-fg-mute);margin:6px 0;max-width:940px}
.oc-note{border-left:2px solid var(--oc-accent);background:var(--oc-surface-2);
  border-radius:0 var(--oc-r-sm) var(--oc-r-sm) 0;padding:10px 14px;font-size:12px;
  line-height:1.75;color:var(--oc-fg-dim);margin:8px 0 0}
.oc-note p{margin:0 0 6px}
.oc-note p:last-child{margin:0}
.oc-warn{color:var(--oc-warn)}
.oc-ok{color:var(--oc-ok)}
.oc-err{color:var(--oc-err);font-size:12px;line-height:1.7}

/* ── 按钮 ─────────────────────────────────────────────────────── */
button,.oc-btn{border:1px solid transparent;border-radius:var(--oc-r-sm);padding:6px 14px;
  font-size:13px;font-weight:500;font-family:inherit;background:var(--oc-accent);color:#fff;
  cursor:pointer;min-height:32px;line-height:1.35;box-sizing:border-box;
  transition:filter .12s,background .12s,color .12s}
button:hover,.oc-btn:hover{filter:brightness(.94)}
button:focus-visible,.oc-btn:focus-visible{outline:2px solid var(--oc-accent);outline-offset:2px}
.oc-btn.gray{background:#6c757d}
.oc-btn.green{background:var(--oc-ok)}
.oc-btn.danger{background:var(--oc-err)}
.oc-btn.ghost{background:transparent;border-color:var(--oc-line);color:inherit}
.oc-btn.ghost:hover{background:var(--oc-surface-2);filter:none}
button:disabled,.oc-btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
button:disabled:hover,.oc-btn:disabled:hover{filter:none}
.oc-btn.ghost:disabled{background:transparent;border-color:var(--oc-line-soft);
  color:var(--oc-fg-mute);opacity:.55}
.oc-btn.ghost:disabled:hover{filter:none}
#btn-open:disabled{background:var(--oc-line);color:var(--oc-fg-mute)}
/* 紧贴输入框的行内按钮、以及操作条里第二个之后的按钮，一律降为次要样式 */
.oc-row button,.oc-row .oc-btn,.oc-rowline button,.oc-rowline .oc-btn,
.oc-actions button+button:not(.ghost):not(.green):not(.danger):not(.gray){
  background:var(--oc-surface-2);border-color:var(--oc-line);color:inherit}
.oc-row button:hover,.oc-row .oc-btn:hover,.oc-rowline button:hover,.oc-rowline .oc-btn:hover,
.oc-actions button+button:not(.ghost):not(.green):not(.danger):not(.gray):hover{
  background:var(--oc-line-soft);filter:none}
.oc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 0}
.oc-actions button,.oc-actions .oc-btn,.oc-actions label{margin:0}
.oc-actions>.oc-hint{margin:0;flex:0 1 auto;max-width:none}

/* ── 表单控件 ─────────────────────────────────────────────────── */
select,input[type=text],input[type=password],input[type=number],input[type=time],
input[type=file],textarea{border:1px solid var(--oc-line);border-radius:var(--oc-r-sm);
  background:var(--oc-surface);padding:0 10px;font-size:13px;font-family:inherit;
  height:32px;min-height:32px;line-height:1.4;color:inherit;box-sizing:border-box;max-width:100%}
textarea{height:auto;padding:8px 10px;line-height:1.6}
input[type=file]{height:auto;min-height:32px;padding:4px 8px;font-size:12px;line-height:1.6}
input[type=checkbox]{width:15px;height:15px;min-height:0;padding:0;margin:0;
  accent-color:var(--oc-accent);vertical-align:-2px;border-radius:3px}
select:focus,input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,
input[type=time]:focus,textarea:focus{border-color:var(--oc-accent);outline:none;
  box-shadow:0 0 0 3px rgba(10,99,187,.14)}
input.oc-addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  background:var(--oc-surface-2);min-width:0}

/* ── 空状态 / 复制按钮 ────────────────────────────────────────── */
.oc-empty{padding:22px 16px;text-align:center;border:1px dashed var(--oc-line);
  border-radius:var(--oc-r);color:var(--oc-fg-mute);font-size:12.5px;background:transparent}
.oc-copy{padding:3px 10px;font-size:12px;border-radius:var(--oc-r-sm);background:transparent;
  color:var(--oc-accent);border:1px solid var(--oc-line);cursor:pointer;margin:0;min-height:28px}
.oc-copy:hover{background:var(--oc-surface-2);filter:none}

/* ── 说明列表 ─────────────────────────────────────────────────── */
.oc-list{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.75;color:var(--oc-fg-mute)}
.oc-list>li{position:relative;padding-left:14px;margin:0 0 7px}
.oc-list>li:last-child{margin-bottom:0}
.oc-list>li::before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;
  border-radius:50%;background:var(--oc-accent);opacity:.55}

/* ── 窄屏 ─────────────────────────────────────────────────────── */
@media (max-width:640px){
  .oc-card{padding:16px 14px}
  .oc-row>label{flex:0 0 100%;width:auto}
  .oc-row>input[type=text],.oc-row>input[type=password],.oc-row>select{flex:1 1 100%;max-width:none}
  .oc-row>.oc-hint{margin-left:0;width:100%}
  .oc-cols{grid-template-columns:1fr}
  .oc-kv{grid-template-columns:92px minmax(0,1fr)}
  .oc-kpi{padding:0 12px}
  .oc-rowline{flex-wrap:wrap}
  .oc-rowline>span:last-child{text-align:left}
}
</style>

<h2><a id="content" name="content">消息渠道</a></h2>

<div class="oc-card">
  <h3>渠道</h3>
  <div class="oc-hint" id="ch-summary">正在读取渠道列表…</div>
  <div class="oc-actions">
    <button id="btn-refresh" class="oc-btn ghost">刷新列表</button>
  </div>
  <div class="oc-hint">
    渠道、参数与状态全部来自 <code>channels.sh channels-list</code>；凭据只通过 POST 提交，
    由控制器写入 0600 临时文件后交给 <code>channels.sh config --key-file</code>，页面不回填任何明文。
  </div>
</div>

<div id="ch-cards"></div>

<div class="oc-card">
  <h3>执行结果</h3>
  <div class="oc-out" id="out">（暂无）</div>
</div>

<script>
var API = '<%=luci.dispatcher.build_url("admin","services","openclaw","api","channels")%>';
var EMPTY_MSG = '未检测到可用渠道，请先安装 OpenClaw 运行环境。';
var ACTION_LABEL = { install: '启用', login: '登录', status: '查询状态', config: '保存配置' };

function $(id){ return document.getElementById(id); }

function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}

function clearNode(n){ while (n.firstChild) n.removeChild(n.firstChild); }

function isArray(v){ return Object.prototype.toString.call(v) === '[object Array]'; }

function setOut(text){
  var s = (text == null) ? '' : String(text);
  $('out').textContent = (s === '') ? '(无输出)' : s;
}

function get(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    cb(r);
  };
  x.send();
}

function post(url, data, cb){
  var body = [];
  for (var k in data) body.push(encodeURIComponent(k) + '=' + encodeURIComponent(data[k]));
  var x = new XMLHttpRequest();
  x.open('POST', url, true);
  x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    cb(r);
  };
  x.send(body.join('&'));
}

/* 控制器把 channels-list 的 JSON 原样放在 data 字符串里，这里再解析一次。 */
function parseList(r){
  if (!r || r.ok !== true || typeof r.data !== 'string') return null;
  var list = null;
  try { list = JSON.parse(r.data); } catch (e) { list = null; }
  return isArray(list) ? list : null;
}

function isSecret(p){
  if (p.secret === true) return true;
  return /token|secret|key|password/i.test(String(p.name || ''));
}

/* 密码框永不回填：占位符只说明后端状态，configuredKnown=false 时不谎报「未设置」。 */
function placeholderFor(ch){
  if (ch.configuredKnown === false) return '无法判断是否已设置（留空则不修改）';
  if (ch.configured === true) return '已设置（留空则不修改）';
  return '未设置';
}

/* 短参数名在部分渠道（feishu / dingtalk / qq）没有已知配置键，
 * channels.sh 会以「参数名未知」拒绝；这类参数必须提交完整键
 * channels.<channelId>.<name>（控制器 ch_key_ok 允许该前缀）。 */
function paramKey(ch, p){
  if (p.configKeyKnown === true && typeof p.configKey === 'string' && p.configKey !== '') {
    return p.configKey;
  }
  if (typeof ch.configKey === 'string' && ch.configKey !== '') {
    return ch.configKey + '.' + String(p.name);
  }
  return String(p.name);
}

function buildCard(ch){
  var card = el('div', 'oc-card');

  var head = el('div', 'oc-head');
  head.appendChild(el('h3', null, ch.name || ch.id || '(未命名渠道)'));
  head.appendChild(el('span', 'oc-tag ' + (ch.enabled === true ? 'ok' : 'off'),
    ch.enabled === true ? '已启用' : '未启用'));
  if (ch.configuredKnown === false) {
    head.appendChild(el('span', 'oc-tag warn', '配置：无法判断'));
  } else {
    head.appendChild(el('span', 'oc-tag ' + (ch.configured === true ? 'ok' : 'warn'),
      ch.configured === true ? '已配置' : '未配置'));
  }
  card.appendChild(head);

  var meta = el('div', 'oc-hint');
  meta.appendChild(document.createTextNode('渠道 ID：'));
  meta.appendChild(el('code', null, ch.id || '-'));
  if (typeof ch.channelId === 'string' && ch.channelId !== '' && ch.channelId !== ch.id) {
    meta.appendChild(document.createTextNode(' · OpenClaw 渠道：'));
    meta.appendChild(el('code', null, ch.channelId));
  }
  card.appendChild(meta);

  if (typeof ch.note === 'string' && ch.note !== '') {
    card.appendChild(el('div', 'oc-note', ch.note));
  }

  var fields = [];
  var params = isArray(ch.params) ? ch.params : [];
  if (params.length > 0) {
    var form = el('div', 'oc-form');
    form.style.marginTop = '10px';
    for (var i = 0; i < params.length; i++) {
      var p = params[i];
      if (!p || typeof p.name !== 'string' || p.name === '') continue;
      var row = el('div', 'oc-row');
      row.appendChild(el('label', null, (p.label || p.name) + (p.required === true ? ' *' : '')));
      var inp = document.createElement('input');
      inp.type = isSecret(p) ? 'password' : 'text';
      inp.value = '';                       /* 后端不返回明文，永不回填 */
      inp.placeholder = placeholderFor(ch);
      inp.autocomplete = 'new-password';
      row.appendChild(inp);
      form.appendChild(row);
      fields.push({ key: paramKey(ch, p), input: inp });
    }
    card.appendChild(form);
  } else {
    card.appendChild(el('div', 'oc-hint', '该渠道没有可在页面填写的参数（凭据由登录流程保存）。'));
  }

  /* actions 由后端声明：没声明 login 的渠道不显示「登录」。
   * 旧版本没有 actions 字段时退回最小集合，避免整张卡片没有按钮。 */
  var acts = isArray(ch.actions) ? ch.actions : ['install', 'status', 'config'];
  var bar = el('div', 'oc-actions');
  var order = ['install', 'login', 'status', 'config'];
  for (var j = 0; j < order.length; j++) {
    var act = order[j];
    if (acts.indexOf(act) < 0) continue;      /* 后端没声明该动作就不显示 */
    var btn = el('button', act === 'install' ? '' : 'oc-btn', ACTION_LABEL[act] || act);
    btn.type = 'button';
    if (act === 'install' && ch.enabled === true) {
      btn.title = '该渠道已启用；点击会重新写入配置并重启网关';
    }
    if (act === 'config' && fields.length === 0) {
      /* 没有可写参数（如微信，凭据由 login 保存）：保留按钮但禁用 */
      btn.disabled = true;
      btn.title = '该渠道没有可在页面填写的参数';
    }
    btn.onclick = (function (action) {
      return function () {
        if (action === 'config') saveConfig(ch, fields, btn);
        else runAction(ch, action, btn);
      };
    })(act);
    bar.appendChild(btn);
  }
  if (bar.firstChild) card.appendChild(bar);
  else card.appendChild(el('div', 'oc-hint', '该渠道未声明可执行动作。'));

  return card;
}

function runAction(ch, action, btn){
  var label = ACTION_LABEL[action] || action;
  var name = String(ch.name || ch.id || '');
  btn.disabled = true;
  setOut('正在' + label + '：' + name + ' …');
  post(API, { action: action, channel: String(ch.id || '') }, function (r) {
    btn.disabled = false;
    if (!r) { setOut(label + '失败：控制器无响应，或返回内容无法解析。'); return; }
    var txt = (typeof r.output === 'string') ? r.output : '';
    if (r.ok === false) {
      var reason = (typeof r.error === 'string' && r.error !== '') ? r.error : (label + '未成功');
      setOut(reason + (txt !== '' ? '\n' + txt : ''));
      return;
    }
    setOut(txt !== '' ? txt : (label + '完成（无输出）。'));
    if (action === 'install') loadList();     /* 启用状态来自后端，重新读取 */
  });
}

function saveConfig(ch, fields, btn){
  /* Object.create(null)：参数名来自后端，用无原型对象避免 __proto__ 之类的键
   * 改写原型链。留空的字段不提交 —— 留空表示「不修改」。 */
  var values = Object.create(null);
  var n = 0;
  for (var i = 0; i < fields.length; i++) {
    var v = fields[i].input.value;
    if (v === '') continue;
    values[fields[i].key] = v;
    n++;
  }
  if (n === 0) {
    setOut('没有填写任何配置项：输入框不会回填已有凭据，请先输入要更新的值。');
    return;
  }
  var payload;
  try { payload = JSON.stringify(values); } catch (e) { payload = ''; }
  if (payload === '' || payload === '{}') { setOut('配置内容无法序列化。'); return; }

  var name = String(ch.name || ch.id || '');
  btn.disabled = true;
  setOut('正在保存配置：' + name + ' …');
  post(API, { action: 'config', channel: String(ch.id || ''), values: payload }, function (r) {
    btn.disabled = false;
    if (!r) { setOut('保存配置失败：控制器无响应，或返回内容无法解析。'); return; }
    var txt = (typeof r.output === 'string') ? r.output : '';
    if (r.ok === false) {
      setOut('保存配置失败：' + (r.error || '未知错误') + (txt !== '' ? '\n' + txt : ''));
      return;
    }
    /* 成功后立刻清空输入框，避免凭据长期停留在 DOM 里。 */
    for (var i = 0; i < fields.length; i++) fields[i].input.value = '';
    setOut('配置已保存。' + (txt !== '' ? '\n' + txt : ''));
    loadList();                                /* 状态以 channels-list 为准 */
  });
}

function showEmpty(msg){
  var host = $('ch-cards');
  clearNode(host);
  var card = el('div', 'oc-card');
  card.appendChild(el('div', 'oc-hint', msg));
  host.appendChild(card);
}

function loadList(){
  $('ch-summary').textContent = '正在读取渠道列表…';
  get(API + '?action=channels_list', function (r) {
    var list = parseList(r);
    if (!list) {
      $('ch-summary').textContent = '渠道列表不可用。';
      showEmpty(EMPTY_MSG + ((r && r.error) ? '（' + r.error + '）' : ''));
      return;
    }
    if (list.length === 0) {
      $('ch-summary').textContent = '渠道列表为空。';
      showEmpty(EMPTY_MSG);
      return;
    }
    var host = $('ch-cards');
    clearNode(host);
    var shown = 0;
    for (var i = 0; i < list.length; i++) {
      var ch = list[i];
      if (!ch || typeof ch !== 'object') continue;
      host.appendChild(buildCard(ch));
      shown++;
    }
    if (shown === 0) { $('ch-summary').textContent = '渠道列表为空。'; showEmpty(EMPTY_MSG); return; }
    $('ch-summary').textContent = '共 ' + shown + ' 个渠道；状态读取自 OpenClaw 配置文件。';
  });
}

$('btn-refresh').onclick = loadList;
loadList();
</script>
<%+footer%>
