<%+header%>
<style>
/* ===== OpenClaw 统一视图样式（8 个视图共用，逐字节一致） =====
 * 中性色统一使用半透明 rgba(127,127,127,α)：同一个值在浅色底上呈浅灰、
 * 在深色底上呈深灰，自动跟随 LuCI 主题，不依赖系统配色方案媒体查询。
 * 强调色（蓝/绿/橙/红）保持固定十六进制，明暗底上均有足够对比度。 */
:root{--oc-fg-dim:rgba(127,127,127,.95);--oc-fg-mute:rgba(127,127,127,.72);
  --oc-line:rgba(127,127,127,.30);--oc-line-soft:rgba(127,127,127,.16);
  --oc-surface:rgba(127,127,127,.06);--oc-surface-2:rgba(127,127,127,.12);
  --oc-accent:#0b74d8;--oc-ok:#2f8f3f;--oc-warn:#c05621;--oc-err:#cc2222;}

/* 卡片 */
.oc-card{border:1px solid var(--oc-line);border-radius:12px;background:var(--oc-surface);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
.oc-card h3{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--oc-line-soft);font-size:15px;font-weight:600;letter-spacing:.01em}
.oc-card h3::before{content:"";display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--oc-accent);margin-right:8px;vertical-align:middle}

/* 多列容器：宽屏两列，窄屏自动单列；行间距交给 .oc-card 的 margin-bottom */
.oc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:0 16px;align-items:start}

/* 渠道卡片头 */
.oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.oc-head h3{margin:0;padding-bottom:0;border-bottom:0;font-size:15px}
.oc-head .oc-tag:first-of-type{margin-left:auto}

/* 键值区 */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.oc-sub{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--oc-fg-mute);text-transform:none}
.oc-card>.oc-sub:first-of-type{margin-top:0}
.oc-kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--oc-line-soft);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.oc-kv:last-child{border-bottom:none}
.oc-kv b{font-size:12.5px;font-weight:400;color:var(--oc-fg-mute);white-space:nowrap;margin:0}
.oc-kv>span{text-align:right;word-break:break-all}

/* 概览数字块 */
.oc-kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.oc-kpi .oc-kpi-label{font-size:12px;font-weight:400;color:var(--oc-fg-mute)}
.oc-kpi-label{margin-top:2px;letter-spacing:.02em}
.oc-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:14px 0 4px;margin-bottom:6px;border-bottom:1px solid var(--oc-line-soft)}

/* 状态徽章 */
.oc-badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;white-space:nowrap}
.oc-badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px}
.oc-run{background:var(--oc-ok)}
.oc-stop{background:#8a8a8a}
.oc-none{background:var(--oc-warn)}

/* 日志（深色控制台） */
.oc-log{background:#1b1b1b;color:#e6e6e6;border-radius:8px;padding:12px;height:280px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap}
.oc-log::-webkit-scrollbar{width:10px;height:10px}
.oc-log::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:6px}
.oc-log::-webkit-scrollbar-track{background:transparent}

/* 执行输出 */
.oc-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--oc-surface-2);border-radius:8px;padding:10px 12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-variant-numeric:tabular-nums}

/* 表单行 */
.oc-row{margin-bottom:12px}
.oc-row label{display:inline-block;width:150px;font-size:13px;color:var(--oc-fg-dim);vertical-align:top}
@media (max-width:600px){.oc-row label{display:block;width:auto;margin-bottom:4px}}

/* 提示与语义文字 */
.oc-hint{font-size:12px;color:var(--oc-fg-mute);margin-top:4px;line-height:1.6}
.oc-note{border-left:3px solid var(--oc-accent);background:var(--oc-surface-2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--oc-fg-dim);margin-top:8px;line-height:1.6}
.oc-warn{color:var(--oc-warn)}
.oc-ok{color:var(--oc-ok)}
.oc-err{color:var(--oc-err)}

/* 小标签 */
.oc-tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--oc-surface-2);color:var(--oc-fg-dim);white-space:nowrap;vertical-align:middle}
.oc-tag.ok{color:var(--oc-ok)}
.oc-tag.warn{color:var(--oc-warn)}
.oc-tag.off{color:var(--oc-fg-mute)}

/* 按钮 */
button,.oc-btn{border:0;border-radius:6px;padding:6px 14px;font-size:13px;background:var(--oc-accent);color:#fff;cursor:pointer;margin-right:6px}
button:hover,.oc-btn:hover{filter:brightness(.94)}
button:focus-visible,.oc-btn:focus-visible{outline:2px solid var(--oc-accent);outline-offset:2px}
.oc-btn.gray{background:#6c757d}
.oc-btn.green{background:var(--oc-ok)}
.oc-btn.ghost{background:transparent;border:1px solid var(--oc-line);color:inherit;padding:5px 13px}
.oc-btn.ghost:hover{background:var(--oc-surface-2);filter:none}
.oc-btn.ghost:disabled{background:transparent;border-color:var(--oc-line-soft);color:var(--oc-fg-mute);opacity:.7;cursor:not-allowed}
.oc-btn.ghost:disabled:hover{filter:none}
.oc-btn.danger{background:var(--oc-err)}
button:disabled,.oc-btn:disabled{background:#9a9a9a;color:#fff;cursor:not-allowed;opacity:.85}
button:disabled:hover,.oc-btn:disabled:hover{filter:none}
#btn-open:disabled{background:#bdbdbd;color:#f7f7f7}
button,.oc-btn{min-height:30px;line-height:1.35;transition:filter .12s,background .12s,color .12s}

/* 操作条 */
.oc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.oc-actions button,.oc-actions .oc-btn{margin-right:0}

/* 表单控件 */
select,input[type=text],input[type=password]{border:1px solid var(--oc-line);border-radius:6px;background:var(--oc-surface);padding:5px 8px;font-size:13px;min-width:260px;color:inherit}
select:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--oc-accent);outline:none}
input.oc-addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--oc-surface-2);min-width:320px}
select,input[type=text],input[type=password]{min-height:30px}

/* 非卡片内的地址 / 路径行 */
.oc-rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.oc-rowline>span{color:var(--oc-fg-mute);font-size:12.5px;white-space:nowrap}

/* 版本号 / 数值药丸 */
.oc-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--oc-surface-2);color:var(--oc-fg-dim);border:1px solid var(--oc-line-soft)}
.oc-pill.ok{background:rgba(47,143,63,.14);color:var(--oc-ok);border-color:rgba(47,143,63,.3)}
.oc-pill.warn{background:rgba(192,86,33,.14);color:var(--oc-warn);border-color:rgba(192,86,33,.3)}
.oc-pill.accent{background:rgba(11,116,216,.14);color:var(--oc-accent);border-color:rgba(11,116,216,.3)}

/* 空状态 */
.oc-empty{padding:22px 16px;text-align:center;border:1px dashed var(--oc-line);border-radius:10px;color:var(--oc-fg-mute);font-size:12.5px;background:transparent}

/* 地址旁的复制按钮 */
.oc-copy{padding:3px 10px;font-size:12px;border-radius:6px;background:transparent;color:var(--oc-accent);border:1px solid var(--oc-line);cursor:pointer;margin:0}
.oc-copy:hover{background:var(--oc-surface-2)}

/* 窄屏适配 */
@media (max-width:600px){.oc-cols{grid-template-columns:1fr}
  .oc-kv{flex-wrap:wrap}.oc-kv>span{text-align:left}}
</style>

<h2><a id="content" name="content">OpenClaw 助手 · 更新说明</a></h2>

<div class="oc-card">
  <h3>版本更新说明</h3>
  <div class="oc-hint">当前版本 <b id="cl-version">读取中…</b></div>
  <div id="cl-body" style="margin-top:10px;white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:13px">正在加载更新说明…</div>
</div>

<script>
var API = '<%=luci.dispatcher.build_url("admin","services","openclaw","api","changelog")%>';

function $(id){ return document.getElementById(id); }

function get(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    cb(r);
  };
  x.send();
}

function clearNode(n){ while (n.firstChild) n.removeChild(n.firstChild); }

/* 所有内容都经 textContent 写入：服务端返回的是 Markdown 原文，
 * 绝不能被当作 HTML 解析。样式走内联 style，避免改动共用 <style> 块。 */
function makeLine(text, css){
  var d = document.createElement('div');
  d.textContent = text;
  if (css) d.style.cssText = css;
  return d;
}

var CSS_TITLE = 'font-size:17px;font-weight:700;margin:0 0 10px';
var CSS_HEAD  = 'font-size:15px;font-weight:700;margin:18px 0 6px';
var CSS_SUB   = 'font-size:13px;font-weight:600;margin:12px 0 4px';
var CSS_ITEM  = 'padding-left:1.2em;text-indent:-1.2em;margin:2px 0';
var CSS_P     = 'margin:4px 0';

function showEmpty(){
  var host = $('cl-body');
  clearNode(host);
  host.appendChild(makeLine('暂无更新说明', 'color:rgba(127,127,127,.72)'));
}

function render(data){
  var host = $('cl-body');
  clearNode(host);
  var lines = String(data == null ? '' : data).split('\n');
  for (var i = 0; i < lines.length; i++){
    var t = lines[i].replace(/\r$/, '').replace(/^\s+|\s+$/g, '');
    if (t === '') continue;
    if (t.indexOf('<!--') === 0) continue;              /* 构建期版本标记 */
    if (t.indexOf('### ') === 0){ host.appendChild(makeLine(t.slice(4), CSS_SUB)); continue; }
    if (t.indexOf('## ') === 0){ host.appendChild(makeLine(t.slice(3), CSS_HEAD)); continue; }
    if (t.indexOf('# ') === 0){ host.appendChild(makeLine(t.slice(2), CSS_TITLE)); continue; }
    if (t.indexOf('- ') === 0 || t.indexOf('* ') === 0){
      host.appendChild(makeLine('• ' + t.slice(2), CSS_ITEM)); continue;
    }
    host.appendChild(makeLine(t, CSS_P));
  }
  if (!host.firstChild) showEmpty();
}

function load(){
  get(API, function (r) {
    if (!r || r.ok !== true || !r.data){
      $('cl-version').textContent = '未知';
      showEmpty();
      return;
    }
    $('cl-version').textContent = (r.version && String(r.version) !== '')
      ? 'v' + String(r.version) : '未知';
    render(r.data);
  });
}

load();
</script>
<%+footer%>
