<%+header%>
<style>
/* ===== OpenClaw 统一视图样式（8 个视图共用，逐字节一致） =====
 * 中性色统一使用半透明 rgba(127,127,127,α)：同一个值在浅色底上呈浅灰、
 * 在深色底上呈深灰，自动跟随 LuCI 主题，不依赖系统配色方案媒体查询。
 * 强调色（蓝/绿/橙/红）保持固定十六进制，明暗底上均有足够对比度。 */
:root{--oc-fg-dim:rgba(127,127,127,.95);--oc-fg-mute:rgba(127,127,127,.72);
  --oc-line:rgba(127,127,127,.30);--oc-line-soft:rgba(127,127,127,.16);
  --oc-surface:rgba(127,127,127,.06);--oc-surface-2:rgba(127,127,127,.12);
  --oc-accent:#0b74d8;--oc-ok:#2f8f3f;--oc-warn:#c05621;--oc-err:#cc2222;}

/* 横向 tab 菜单（药丸式，参考 iStoreOS openclawmgr） */
.oc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.oc-tab{display:inline-block;padding:6px 14px;font-size:13px;color:var(--oc-fg-dim);text-decoration:none;border:1px solid var(--oc-line);border-radius:8px;background:transparent;white-space:nowrap}
.oc-tab:hover{background:var(--oc-surface-2);color:inherit;text-decoration:none}
.oc-tab.active{background:rgba(11,116,216,.12);border-color:rgba(11,116,216,.45);color:var(--oc-accent);font-weight:600}

/* 卡片 */
.oc-card{border:1px solid var(--oc-line);border-radius:12px;background:var(--oc-surface);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
.oc-card h3{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--oc-line-soft);font-size:15px;font-weight:600;letter-spacing:.01em}
.oc-card h3::before{content:"";display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--oc-accent);margin-right:8px;vertical-align:middle}

/* 多列容器：宽屏两列，窄屏自动单列；行间距交给 .oc-card 的 margin-bottom */
.oc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:0 16px;align-items:start}

/* 渠道卡片头 */
.oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.oc-head h3{margin:0;padding-bottom:0;border-bottom:0;font-size:15px}
.oc-head .oc-tag:first-of-type{margin-left:auto}

/* 键值区 */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.oc-sub{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--oc-fg-mute);text-transform:none}
.oc-card>.oc-sub:first-of-type{margin-top:0}
.oc-kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--oc-line-soft);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.oc-kv:last-child{border-bottom:none}
.oc-kv b{font-size:12.5px;font-weight:400;color:var(--oc-fg-mute);white-space:nowrap;margin:0}
.oc-kv>span{text-align:right;word-break:break-all}

/* 概览数字块 */
.oc-kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.oc-kpi .oc-kpi-label{font-size:12px;font-weight:400;color:var(--oc-fg-mute)}
.oc-kpi-label{margin-top:2px;letter-spacing:.02em}
.oc-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:14px 0 4px;margin-bottom:6px;border-bottom:1px solid var(--oc-line-soft)}

/* 状态徽章 */
.oc-badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;white-space:nowrap}
.oc-badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px}
.oc-run{background:var(--oc-ok)}
.oc-stop{background:#8a8a8a}
.oc-none{background:var(--oc-warn)}

/* 日志（深色控制台） */
.oc-log{background:#1b1b1b;color:#e6e6e6;border-radius:8px;padding:12px;height:280px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap}
.oc-log::-webkit-scrollbar{width:10px;height:10px}
.oc-log::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:6px}
.oc-log::-webkit-scrollbar-track{background:transparent}

/* 执行输出 */
.oc-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--oc-surface-2);border-radius:8px;padding:10px 12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-variant-numeric:tabular-nums}

/* 表单行 */
.oc-row{margin-bottom:12px}
.oc-row label{display:inline-block;width:150px;font-size:13px;color:var(--oc-fg-dim);vertical-align:top}
@media (max-width:600px){.oc-row label{display:block;width:auto;margin-bottom:4px}}

/* 提示与语义文字 */
.oc-hint{font-size:12px;color:var(--oc-fg-mute);margin-top:4px;line-height:1.6}
.oc-note{border-left:3px solid var(--oc-accent);background:var(--oc-surface-2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--oc-fg-dim);margin-top:8px;line-height:1.6}
.oc-warn{color:var(--oc-warn)}
.oc-ok{color:var(--oc-ok)}
.oc-err{color:var(--oc-err)}

/* 小标签 */
.oc-tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--oc-surface-2);color:var(--oc-fg-dim);white-space:nowrap;vertical-align:middle}
.oc-tag.ok{color:var(--oc-ok)}
.oc-tag.warn{color:var(--oc-warn)}
.oc-tag.off{color:var(--oc-fg-mute)}

/* 按钮 */
button,.oc-btn{border:0;border-radius:6px;padding:6px 14px;font-size:13px;background:var(--oc-accent);color:#fff;cursor:pointer;margin-right:6px}
button:hover,.oc-btn:hover{filter:brightness(.94)}
button:focus-visible,.oc-btn:focus-visible{outline:2px solid var(--oc-accent);outline-offset:2px}
.oc-btn.gray{background:#6c757d}
.oc-btn.green{background:var(--oc-ok)}
.oc-btn.ghost{background:transparent;border:1px solid var(--oc-line);color:inherit;padding:5px 13px}
.oc-btn.ghost:hover{background:var(--oc-surface-2);filter:none}
.oc-btn.ghost:disabled{background:transparent;border-color:var(--oc-line-soft);color:var(--oc-fg-mute);opacity:.7;cursor:not-allowed}
.oc-btn.ghost:disabled:hover{filter:none}
.oc-btn.danger{background:var(--oc-err)}
button:disabled,.oc-btn:disabled{background:#9a9a9a;color:#fff;cursor:not-allowed;opacity:.85}
button:disabled:hover,.oc-btn:disabled:hover{filter:none}
#btn-open:disabled{background:#bdbdbd;color:#f7f7f7}
button,.oc-btn{min-height:30px;line-height:1.35;transition:filter .12s,background .12s,color .12s}

/* 操作条 */
.oc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.oc-actions button,.oc-actions .oc-btn{margin-right:0}

/* 表单控件 */
select,input[type=text],input[type=password]{border:1px solid var(--oc-line);border-radius:6px;background:var(--oc-surface);padding:5px 8px;font-size:13px;min-width:260px;color:inherit}
select:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--oc-accent);outline:none}
input.oc-addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--oc-surface-2);min-width:320px}
select,input[type=text],input[type=password]{min-height:30px}

/* 非卡片内的地址 / 路径行 */
.oc-rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.oc-rowline>span{color:var(--oc-fg-mute);font-size:12.5px;white-space:nowrap}

/* 版本号 / 数值药丸 */
.oc-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--oc-surface-2);color:var(--oc-fg-dim);border:1px solid var(--oc-line-soft)}
.oc-pill.ok{background:rgba(47,143,63,.14);color:var(--oc-ok);border-color:rgba(47,143,63,.3)}
.oc-pill.warn{background:rgba(192,86,33,.14);color:var(--oc-warn);border-color:rgba(192,86,33,.3)}
.oc-pill.accent{background:rgba(11,116,216,.14);color:var(--oc-accent);border-color:rgba(11,116,216,.3)}

/* 空状态 */
.oc-empty{padding:22px 16px;text-align:center;border:1px dashed var(--oc-line);border-radius:10px;color:var(--oc-fg-mute);font-size:12.5px;background:transparent}

/* 地址旁的复制按钮 */
.oc-copy{padding:3px 10px;font-size:12px;border-radius:6px;background:transparent;color:var(--oc-accent);border:1px solid var(--oc-line);cursor:pointer;margin:0}
.oc-copy:hover{background:var(--oc-surface-2)}

/* 窄屏适配 */
@media (max-width:600px){.oc-cols{grid-template-columns:1fr}
  .oc-kv{flex-wrap:wrap}.oc-kv>span{text-align:left}}
</style>

<h2><a id="content" name="content">OpenClaw 助手 · 备份与恢复</a></h2>

<div class="oc-card">
  <h3>备份与恢复</h3>
  <div class="oc-hint">
    备份内容：OpenClaw 配置（模型 / 渠道 / 会话 / 工作区）与 UCI 设置。<br>
    <b>不含</b> Node.js 运行时与 OpenClaw 程序本体 —— 这两项可重新安装，备份因此很小。<br>
    <b style="color:#b00">⚠️ 备份文件内含 API Key，请勿外传</b>；归档权限固定为 600。
  </div>
  <div style="margin-top:10px">
    <button id="btn-backup">立即备份</button>
    <input type="text" id="bk-name" placeholder="备注名（可选）" style="min-width:150px">
    <label style="margin-left:10px;font-size:12px">
      <input type="checkbox" id="bk-ws" checked> 包含工作区数据
    </label>
    <button id="btn-bk-refresh" class="oc-btn ghost">刷新列表</button>
  </div>
  <div style="margin-top:10px">
    <input type="file" id="bk-file" accept=".gz">
    <button id="btn-bk-upload" class="oc-btn ghost">上传并恢复</button>
    <span class="oc-hint" style="margin-left:6px">（上传的归档会先做安全校验，通过后才允许还原）</span>
  </div>
  <div id="bk-status" class="oc-hint" style="margin-top:8px"></div>
  <div id="bk-list" style="margin-top:8px"></div>
</div>

<script>
var API = {
  info: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","info")%>',
  versions: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","versions")%>',
  check: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","check")%>',
  install: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","install")%>',
  istatus: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","istatus")%>',
  ilog: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","ilog")%>',
  service: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","service")%>',
  save: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","save")%>',
  mounts: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","mounts")%>',
  discover: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","discover")%>',
  node_existing: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","node_existing")%>',
  migrate: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","migrate")%>',
  doctor: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","doctor")%>',
  repair: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","repair")%>',
  diag_run: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_run")%>',
  diag_poll: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_poll")%>',
  backups: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backups")%>',
  backup_create: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_create")%>',
  backup_verify: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_verify")%>',
  backup_delete: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_delete")%>',
  backup_upload: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_upload")%>',
  backup_download: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_download")%>',
  restore: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","restore")%>'
};

function $(id){ return document.getElementById(id); }
// 回调只允许触发一次：readyState==4 与 onerror 在某些浏览器上会同时到达，
// 没有这个守卫时同一次请求会把按钮禁用/恢复跑两遍。
function once(cb){
  var done = false;
  return function(v){ if (done) return; done = true; cb(v); };
}
function post(url, data, cb){
  var body = [];
  for (var k in data) body.push(encodeURIComponent(k)+'='+encodeURIComponent(data[k]));
  var x = new XMLHttpRequest();
  x.open('POST', url, true);
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  var fin = once(cb);
  x.onreadystatechange = function(){
    if (x.readyState == 4) { try { fin(JSON.parse(x.responseText)); } catch(e){ fin({ok:false}); } }
  };
  // 连接被重置 / 请求超时：readyState 可能根本不到 4，回调就永远不来，
  // 发起方（例如备份、迁移）会永久卡在 disabled。用 net:true 标记，
  // 让轮询类调用方知道"这次没拿到数据"而不是"服务端说失败了"。
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  x.send(body.join('&'));
}
function get(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  var fin = once(cb);
  x.onreadystatechange = function(){ if (x.readyState==4){ try{fin(JSON.parse(x.responseText));}catch(e){fin({ok:false});} } };
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  x.send();
}
function jp(s, fb){ try { return JSON.parse(s); } catch(e){ return fb; } }
function fields(v){ var a=(v||'0.0.0').replace(/^v/,'').split('.'); for(var i=0;i<3;i++){ a[i]=parseInt((a[i]||'0').replace(/[^0-9].*$/,''),10)||0; } return a; }

// ---------------------------------------------------------------- 备份 / 恢复
function bkSay(msg, bad){
  var el = $('bk-status');
  el.textContent = msg;
  el.style.color = bad ? '#b00' : '';
}

function fmtSize(n){
  if (n >= 1048576) return (n/1048576).toFixed(1) + ' MB';
  if (n >= 1024) return (n/1024).toFixed(0) + ' KB';
  return n + ' B';
}

function fmtTime(ts){
  if (!ts) return '-';
  var d = new Date(ts * 1000);
  var p = function(x){ return (x<10?'0':'') + x; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' '
       + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function loadBackups(){
  var host = $('bk-list');
  get(API.backups, function(r){
    var arr = jp(r.data || '[]', []);
    host.innerHTML = '';
    host.className = '';                    // 每次重绘先复位，避免上一次的 oc-empty / oc-warn 残留
    if (r && r.ok === false && !arr.length){
      host.textContent = '（读取备份列表失败，请刷新重试）';
      host.className = 'oc-hint oc-warn';
      return;
    }
    if (!arr.length){
      // 空状态：.oc-empty 虚线框，文字只进 textContent
      host.textContent = '暂无备份。点上方「立即备份」创建第一份。';
      host.className = 'oc-empty';
      return;
    }

    arr.forEach(function(b){
      // 一行 = 文件名（左） + 体积 / 时间 / 操作（右）
      var row = document.createElement('div');
      row.className = 'oc-rowline';
      row.style.flexWrap = 'wrap';            // 窄屏下右侧操作区整体换行，不挤压文件名

      var name = document.createElement('span');
      name.textContent = b.file;              // 服务端数据只进 textContent
      // .oc-rowline>span 默认 nowrap，长文件名需要允许换行
      name.style.whiteSpace = 'normal';
      name.style.wordBreak = 'break-all';
      name.style.color = 'var(--oc-fg-dim)';
      row.appendChild(name);

      var act = document.createElement('div');
      act.style.display = 'flex';
      act.style.alignItems = 'center';
      act.style.gap = '8px';
      act.style.flexWrap = 'wrap';
      act.style.justifyContent = 'flex-end';

      var meta = document.createElement('span');
      meta.className = 'oc-hint';
      meta.style.marginTop = '0';
      meta.style.whiteSpace = 'nowrap';
      meta.textContent = fmtSize(b.size || 0) + ' · ' + fmtTime(b.mtime);
      act.appendChild(meta);

      var mk = function(label, fn, gray){
        var btn = document.createElement('button');
        btn.textContent = label;
        btn.className = 'oc-btn' + (gray ? ' gray' : '');
        btn.style.fontSize = '12px';
        btn.style.padding = '3px 9px';
        btn.onclick = fn;
        act.appendChild(btn);
        return btn;
      };

      mk('下载', function(){
        window.open(API.backup_download + '?file=' + encodeURIComponent(b.file), '_blank');
      }, true);
      mk('校验', function(){
        bkSay('正在校验 ' + b.file + ' …');
        post(API.backup_verify, { file: b.file }, function(rr){
          bkSay(rr && rr.ok ? ('校验通过：' + b.file) : ('校验失败：' + ((rr && rr.data) || '未知错误')), !(rr && rr.ok));
        });
      }, true);
      mk('恢复', function(){
        if (!confirm('将用 ' + b.file + ' 覆盖当前配置与数据，并重启网关。\n'
                   + '系统会先自动做一次还原前快照。继续？')) return;
        bkSay('正在恢复 ' + b.file + ' …（会先做安全快照，可能需要一会儿）');
        post(API.restore, { file: b.file }, function(rr){
          bkSay(rr && rr.ok ? '恢复完成，网关已重启。' : ('恢复失败：' + ((rr && rr.data) || '未知错误')), !(rr && rr.ok));
          loadBackups();
        });
      });
      mk('删除', function(){
        if (!confirm('删除备份 ' + b.file + ' ？')) return;
        post(API.backup_delete, { file: b.file }, function(rr){
          bkSay(rr && rr.ok ? ('已删除 ' + b.file) : ('删除失败：' + ((rr && rr.data) || '')), !(rr && rr.ok));
          loadBackups();
        });
      }, true);

      row.appendChild(act);
      host.appendChild(row);
    });
  });
}

$('btn-backup').onclick = function(){
  var nm = $('bk-name').value.trim();
  var ws = $('bk-ws').checked ? '1' : '0';
  $('btn-backup').disabled = true;
  bkSay('正在打包…');
  post(API.backup_create, { name: nm, workspace: ws }, function(r){
    $('btn-backup').disabled = false;
    bkSay(r && r.ok ? '备份已创建。' : ('备份失败：' + ((r && r.data) || (r && r.error) || '未知错误')), !(r && r.ok));
    loadBackups();
  });
};

$('btn-bk-refresh').onclick = loadBackups;

$('btn-bk-upload').onclick = function(){
  var f = $('bk-file').files && $('bk-file').files[0];
  if (!f){ alert('请先选择备份文件（.tar.gz）'); return; }
  if (!confirm('将用上传的备份覆盖当前配置与数据，并重启网关。\n系统会先自动做一次还原前快照。继续？')) return;
  $('btn-bk-upload').disabled = true;
  bkSay('正在上传 ' + f.name + ' …');
  var fd = new FormData();
  fd.append('archive', f);
  var x = new XMLHttpRequest();
  x.open('POST', API.backup_upload, true);
  // 网络中断/连接被重置时 readyState 也会到 4，但 responseText 为空；
  // 显式处理 onerror 并恢复按钮，避免用户卡在"上传中"且无法重试。
  x.onerror = function(){
    $('btn-bk-upload').disabled = false;
    bkSay('上传失败：网络错误或连接中断，请重试', true);
  };
  x.ontimeout = x.onerror;
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var r; try { r = JSON.parse(x.responseText); } catch(e){ r = {}; }
    if (!r.ok){
      $('btn-bk-upload').disabled = false;
      bkSay('上传失败：' + (r.error || '未知错误'), true);
      return;
    }
    bkSay('上传完成，正在校验并恢复…');
    post(API.restore, { uploaded: r.file }, function(rr){
      $('btn-bk-upload').disabled = false;
      bkSay(rr && rr.ok ? '恢复完成，网关已重启。' : ('恢复失败：' + ((rr && rr.data) || '未知错误')), !(rr && rr.ok));
      loadBackups();
    });
  };
  x.send(fd);
};

loadBackups();
</script>
