<%+header%>
<style>
/* ===== OpenClaw 统一视图样式（6 个视图共用，逐字节一致） =====
 * 中性色统一使用半透明 rgba(127,127,127,α)：同一个值在浅色底上呈浅灰、
 * 在深色底上呈深灰，自动跟随 LuCI 主题，不依赖系统配色方案媒体查询。
 * 强调色（蓝/绿/橙/红）保持固定十六进制，明暗底上均有足够对比度。 */
:root{--oc-fg-dim:rgba(127,127,127,.95);--oc-fg-mute:rgba(127,127,127,.72);
  --oc-line:rgba(127,127,127,.30);--oc-line-soft:rgba(127,127,127,.16);
  --oc-surface:rgba(127,127,127,.06);--oc-surface-2:rgba(127,127,127,.12);
  --oc-accent:#0b74d8;--oc-ok:#2f8f3f;--oc-warn:#c05621;--oc-err:#cc2222;}

/* 卡片 */
.oc-card{border:1px solid var(--oc-line);border-radius:10px;background:var(--oc-surface);padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.oc-card h3{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--oc-line-soft);font-size:15px;font-weight:600}

/* 渠道卡片头 */
.oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.oc-head h3{margin:0;padding-bottom:0;border-bottom:0;font-size:15px}
.oc-head .oc-tag:first-of-type{margin-left:auto}

/* 键值区 */
.oc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.oc-sub{margin:16px 0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--oc-fg-mute);text-transform:none}
.oc-card>.oc-sub:first-of-type{margin-top:0}
.oc-kv{font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.oc-kv b{display:block;color:var(--oc-fg-mute);font-weight:normal;font-size:12px;margin-bottom:2px}

/* 状态徽章 */
.oc-badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;white-space:nowrap}
.oc-badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px}
.oc-run{background:var(--oc-ok)}
.oc-stop{background:#8a8a8a}
.oc-none{background:var(--oc-warn)}

/* 日志（深色控制台） */
.oc-log{background:#1b1b1b;color:#e6e6e6;border-radius:8px;padding:12px;height:280px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap}
.oc-log::-webkit-scrollbar{width:10px;height:10px}
.oc-log::-webkit-scrollbar-thumb{background:rgba(127,127,127,.55);border-radius:6px}
.oc-log::-webkit-scrollbar-track{background:transparent}

/* 执行输出 */
.oc-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--oc-surface-2);border-radius:8px;padding:10px 12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-variant-numeric:tabular-nums}

/* 表单行 */
.oc-row{margin-bottom:12px}
.oc-row label{display:inline-block;width:150px;font-size:13px;color:var(--oc-fg-dim);vertical-align:top}
@media (max-width:600px){.oc-row label{display:block;width:auto;margin-bottom:4px}}

/* 提示与语义文字 */
.oc-hint{font-size:12px;color:var(--oc-fg-mute);margin-top:4px;line-height:1.6}
.oc-note{border-left:3px solid var(--oc-accent);background:var(--oc-surface-2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--oc-fg-dim);margin-top:8px;line-height:1.6}
.oc-warn{color:var(--oc-warn)}
.oc-ok{color:var(--oc-ok)}
.oc-err{color:var(--oc-err)}

/* 小标签 */
.oc-tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;background:var(--oc-surface-2);color:var(--oc-fg-dim);white-space:nowrap;vertical-align:middle}
.oc-tag.ok{color:var(--oc-ok)}
.oc-tag.warn{color:var(--oc-warn)}
.oc-tag.off{color:var(--oc-fg-mute)}

/* 按钮 */
button,.oc-btn{border:0;border-radius:6px;padding:6px 14px;font-size:13px;background:var(--oc-accent);color:#fff;cursor:pointer;margin-right:6px}
button:hover,.oc-btn:hover{filter:brightness(.94)}
button:focus-visible,.oc-btn:focus-visible{outline:2px solid var(--oc-accent);outline-offset:2px}
.oc-btn.gray{background:#6c757d}
.oc-btn.green{background:var(--oc-ok)}
button:disabled,.oc-btn:disabled{background:#9a9a9a;color:#fff;cursor:not-allowed;opacity:.85}
button:disabled:hover,.oc-btn:disabled:hover{filter:none}
#btn-open:disabled{background:#bdbdbd;color:#f7f7f7}

/* 操作条 */
.oc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.oc-actions button,.oc-actions .oc-btn{margin-right:0}

/* 表单控件 */
select,input[type=text],input[type=password]{border:1px solid var(--oc-line);border-radius:6px;background:var(--oc-surface);padding:5px 8px;font-size:13px;min-width:260px;color:inherit}
select:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--oc-accent);outline:none}
input.oc-addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--oc-surface-2);min-width:320px}
</style>

<h2><a id="content" name="content">OpenClaw 助手 · 设置</a></h2>

<div class="oc-card">
  <h3>安装 / 修复运行环境</h3>
  <div class="oc-row">
    <label>安装目录</label>
    <select id="in-dir" style="min-width:320px"></select>
    <input type="text" id="in-dir-custom" placeholder="或手动输入目录，如 /mnt/nvme0n1-3/Configs/OpenClaw" style="min-width:280px">
  </div>
  <div class="oc-hint" id="in-dir-hint">
    <div id="in-dir-warn" class="oc-err" style="display:none;margin-bottom:4px"></div>
    建议选数据盘挂载点下的目录，例如 /mnt/&lt;磁盘&gt;/OpenClaw；不要选 /overlay、/rom 等系统分区。
  </div>

  <div class="oc-row" style="margin-top:10px">
    <label>程序位置</label>
    <input type="text" id="in-ocdir-shown" class="oc-addr" readonly>
    <button id="btn-ocdir-reset" class="oc-btn gray" style="display:none">恢复默认</button>
  </div>
  <div class="oc-hint" id="in-ocdir-hint">
    <div id="in-ocdir-warn" class="oc-err" style="display:none;margin-bottom:4px"></div>
    OpenClaw 程序本体固定装在 &lt;安装目录&gt;/openclaw，与数据分开存放 —— 卸载时只删程序、保留会话与凭据。
    <div style="font-size:12px;margin-top:2px">需要把程序与数据分开存放时，请在 SSH 里 uci set openclaw.main.openclaw_dir=... 后重新安装。</div>
    <div id="in-ocdir-msg" class="oc-ok" style="display:none;margin-top:4px"></div>
  </div>

  <div class="oc-row" style="margin-top:14px">
    <label>OpenClaw 版本</label>
    <select id="in-oc"></select>
    <button id="btn-reload-versions" class="oc-btn gray">重新获取版本</button>
  </div>
  <div class="oc-hint" id="in-engines">在线获取中…</div>

  <div class="oc-row" style="margin-top:14px">
    <label>Node.js 版本</label>
    <select id="in-node"></select>
  </div>
  <div class="oc-hint" id="in-node-hint"></div>

  <div class="oc-row" style="margin-top:14px">
    <label>npm 源</label>
    <select id="in-registry">
      <option value="https://registry.npmjs.org">官方 registry.npmjs.org</option>
      <option value="https://registry.npmmirror.com">npmmirror（国内加速）</option>
    </select>
  </div>
  <div class="oc-row">
    <label>Node.js 源</label>
    <select id="in-nodemirror">
      <option value="">自动（musl 用 unofficial-builds）</option>
      <option value="https://unofficial-builds.nodejs.org/download/release">unofficial-builds（musl，官方）</option>
      <option value="https://nodejs.org/dist">nodejs.org（glibc）</option>
      <option value="https://registry.npmmirror.com/-/binary/node-unofficial-builds">npmmirror 镜像（国内加速）</option>
    </select>
  </div>
  <div class="oc-row">
    <label>HTTP 代理</label>
    <input type="text" id="in-proxy" placeholder="例如 http://127.0.0.1:7890，可留空">
  </div>

  <div style="margin-top:14px">
    <button id="btn-install">安装 / 修复运行环境</button>
    <button id="btn-uninstall" class="oc-btn gray" style="background:#c05621">卸载运行时</button>
  </div>

  <div style="margin-top:14px">
    <div class="oc-hint">安装日志</div>
    <div class="oc-log" id="in-log">（尚未开始）</div>
  </div>
</div>

<div class="oc-card">
  <h3>基本设置</h3>
  <div class="oc-row"><label>网关端口</label><input type="text" id="cfg-port" style="min-width:120px"></div>
  <div class="oc-row"><label>绑定模式</label>
    <select id="cfg-bind">
      <option value="loopback">loopback（仅本机）</option>
      <option value="lan">lan（局域网，默认）</option>
      <option value="auto">auto</option>
      <option value="tailnet">tailnet</option>
      <option value="custom">custom</option>
    </select>
  </div>
  <div class="oc-row"><label>开机自启</label>
    <select id="cfg-enabled"><option value="1">启用</option><option value="0">禁用</option></select>
  </div>
  <div style="margin-top:10px"><button id="btn-save">保存并应用</button></div>
</div>

<div class="oc-hint" style="margin-top:8px">
  备份与恢复已移到独立页面：<a href="<%=luci.dispatcher.build_url("admin","services","openclaw","backup")%>">备份与恢复</a>
</div>

<script>
var API = {
  info: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","info")%>',
  versions: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","versions")%>',
  check: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","check")%>',
  install: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","install")%>',
  istatus: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","istatus")%>',
  ilog: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","ilog")%>',
  service: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","service")%>',
  save: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","save")%>',
  mounts: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","mounts")%>',
  discover: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","discover")%>',
  node_existing: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","node_existing")%>',
  link: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","link")%>',
  migrate: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","migrate")%>',
  doctor: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","doctor")%>',
  repair: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","repair")%>',
  diag_run: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_run")%>',
  diag_poll: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","diag_poll")%>',
  backups: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backups")%>',
  backup_create: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_create")%>',
  backup_verify: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_verify")%>',
  backup_delete: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_delete")%>',
  backup_upload: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_upload")%>',
  backup_download: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","backup_download")%>',
  restore: '<%=luci.dispatcher.build_url("admin","services","openclaw","api","restore")%>'
};
var state = { info:null, ocList:[], nodeList:[], engines:'', poll:null, logTimer:null, disc:null, nodeExisting:[], nodeBusy:false,
  // ocdirCustom：服务端当前保存的自定义程序目录（main.openclaw_dir），空串 = 默认
  // <安装目录>/openclaw。程序目录不再由用户在页面上编辑，但必须原样回传给
  // save / install —— 否则会把 SSH 或关联流程设置的值冲掉。
  ocdirCustom: '',
  // istatSeq：页面初始化时那次 install-status 请求的序号。用户一旦自己点了安装，
  // 就把序号 +1 作废它 —— 否则迟到的响应会把刚写下的「安装已启动」日志覆盖掉。
  istatSeq: 0,
  // logHeader：轮询期间固定在日志区顶部的提示行（例如"已自动接管进度显示"）。
  // 日志每 2 秒整段重写，必须由这里带上，否则第一轮刷新就被冲掉。
  logHeader: '' };

function $(id){ return document.getElementById(id); }
// 回调只允许触发一次：readyState==4 与 onerror 在某些浏览器上会同时到达，
// 没有这个守卫时同一次请求会把按钮禁用/恢复跑两遍。
function once(cb){
  var done = false;
  return function(v){ if (done) return; done = true; cb(v); };
}
function post(url, data, cb){
  var body = [];
  for (var k in data) body.push(encodeURIComponent(k)+'='+encodeURIComponent(data[k]));
  var x = new XMLHttpRequest();
  x.open('POST', url, true);
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  var fin = once(cb);
  x.onreadystatechange = function(){
    if (x.readyState == 4) { try { fin(JSON.parse(x.responseText)); } catch(e){ fin({ok:false}); } }
  };
  // 连接被重置 / 请求超时：readyState 可能根本不到 4，回调就永远不来，
  // 发起方（例如备份、迁移）会永久卡在 disabled。用 net:true 标记，
  // 让轮询类调用方知道"这次没拿到数据"而不是"服务端说失败了"。
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  x.send(body.join('&'));
}
function get(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  var fin = once(cb);
  x.onreadystatechange = function(){ if (x.readyState==4){ try{fin(JSON.parse(x.responseText));}catch(e){fin({ok:false});} } };
  x.onerror   = function(){ fin({ok:false, net:true}); };
  x.ontimeout = function(){ fin({ok:false, net:true}); };
  x.send();
}
function jp(s, fb){ try { return JSON.parse(s); } catch(e){ return fb; } }

// ------------------------------- 目录检查（只是提示，最终以后端校验为准）
// 后端 oc_validate_base_dir 还会解析符号链接、检查真实路径，这里只覆盖用户
// 最常撞到的两类误填：目录落在系统分区上、程序目录 == 安装目录（或它的上级）。
// 目的不是替代后端，而是在点"安装"之前就把"为什么不行、该怎么改"说清楚。
var OC_SYS_PREFIXES = [
  ['/bin','是系统程序目录'], ['/sbin','是系统程序目录'], ['/lib','是系统库目录'],
  ['/usr','是系统程序目录'], ['/etc','是系统配置目录'],
  ['/proc','是内核虚拟文件系统'], ['/sys','是内核虚拟文件系统'], ['/dev','是设备目录'],
  ['/run','是运行时临时目录'], ['/tmp','是内存临时目录（重启即清空）'],
  ['/var','是运行时数据目录'], ['/overlay','是根文件系统的 overlay（系统分区）'],
  ['/rom','是只读的固件分区'], ['/root','是 root 用户的主目录']
];

// 与后端一致：去掉首尾空白与尾部斜杠（"/" 本身保留）
function normDir(p){
  p = String(p || '').replace(/^\s+|\s+$/g, '');
  while (p.length > 1 && p.charAt(p.length-1) === '/') p = p.slice(0, -1);
  return p;
}

// 返回不适合放应用数据的原因；空字符串 = 这一层看不出问题
function dirProblem(p){
  p = normDir(p);
  if (!p) return '';
  if (p.charAt(0) !== '/') return '请填写以 / 开头的绝对路径。';
  if (p === '/') return '根目录是系统分区，不能放应用数据。';
  // 与后端 oc_validate_base_dir_shape 一致：不允许 . / .. 段（后端还会解析符号链接）
  if (/(^|\/)\.\.?(\/|$)/.test(p)) return '路径不能包含 . 或 .. 段，请填写规范化后的绝对路径。';
  for (var i = 0; i < OC_SYS_PREFIXES.length; i++){
    var pre = OC_SYS_PREFIXES[i][0];
    if (p !== pre && p.indexOf(pre + '/') !== 0) continue;
    if (pre === '/overlay')
      return '/overlay 是系统分区（根文件系统的 overlay），容量有限且与系统配置混在一起，不适合放应用数据。'
           + '请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
    if (pre === '/rom')
      return '/rom 是只读的固件分区，无法写入。请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
    return pre + ' ' + OC_SYS_PREFIXES[i][1] + '，不能放应用数据。'
         + '请改选数据盘挂载点下的目录，例如 /mnt/<磁盘>/OpenClaw。';
  }
  return '';
}

// 程序目录的冲突检查：留空 = 默认 <安装目录>/openclaw，永远安全
function ocDirProblem(base, ocdir){
  base = normDir(base); ocdir = normDir(ocdir);
  if (!ocdir) return '';
  var p = dirProblem(ocdir);
  if (p) return p;
  if (base && ocdir === base)
    return '程序目录不能等于安装目录（' + base + '）：那样卸载时会连带删除数据（会话 / 工作区）。'
         + '留空即可 —— 程序会自动装到 ' + base + '/openclaw。';
  if (base && base.indexOf(ocdir + '/') === 0)
    return '程序目录不能是安装目录的上级（' + ocdir + ' 包含 ' + base + '）：'
         + '卸载时会连同安装目录（含数据）一起删除。留空即可 —— 程序会自动装到 '
         + base + '/openclaw。';
  return '';
}

function setHint(id, msg){
  var el = $(id);
  if (!el) return;
  el.textContent = msg || '';            // 服务端数据 / 用户输入只进 textContent
  el.style.display = msg ? '' : 'none';
}

function currentDirs(){
  return {
    base:  normDir($('in-dir-custom').value || $('in-dir').value),
    // 程序目录只来自服务端（SSH / 关联已有安装写入的 UCI），页面上没有输入框
    ocdir: normDir(state.ocdirCustom)
  };
}

// 只读展示「程序位置」：默认 <安装目录>/openclaw；服务端保存过自定义值时显示它。
// 自定义值可能是 SSH 里手工设错的，所以照样过一遍 ocDirProblem() 给出告警。
function renderOcdir(){
  var base = normDir($('in-dir-custom').value || $('in-dir').value);
  var ocdir = normDir(state.ocdirCustom);
  var shown = ocdir || (base ? base + '/openclaw' : '');
  $('in-ocdir-shown').value = shown;      // 服务端数据只进 input.value
  $('btn-ocdir-reset').style.display = ocdir ? '' : 'none';
  setHint('in-ocdir-msg', '');            // 目录一变，上一次「已恢复默认」的提示就过期了
  setHint('in-ocdir-warn', ocDirProblem(base, ocdir));
}

// 刷新两条 hint，并把本次检查结果返回给调用方（提交前拦截用）
function dirCheck(){
  var d = currentDirs();
  var baseMsg = dirProblem(d.base);
  var ocMsg   = ocDirProblem(d.base, d.ocdir);
  setHint('in-dir-warn', baseMsg);
  setHint('in-ocdir-warn', ocMsg);
  return { base: baseMsg, ocdir: ocMsg, dirs: d };
}

// 设置页只回填设置相关控件；状态卡的元素在 openclaw/status 页面。
function loadInfo(){
  get(API.info, function(r){
    var d = jp(r.data||'{}', {});
    state.info = d;
    $('cfg-port').value = d.port||'18789';
    $('cfg-bind').value = d.bind||'lan';
    if (d.base_dir && !$('in-dir-custom').value) $('in-dir-custom').value = d.base_dir;
    // 程序目录是服务端状态：oc_dir_custom 为假表示用默认（<安装目录>/openclaw）
    state.ocdirCustom = d.oc_dir_custom ? (d.openclaw_dir || '') : '';
    // 记住服务端当前保存的配置值，用于在安装前判断"程序目录是否被改动"
    state.savedOcdir = state.ocdirCustom;
    // 回填后的目录组合也要立刻检查一次（刷新 / 保存后不会残留旧的红字）
    dirCheck();
    renderOcdir();
  });
}

function loadMounts(){
  get(API.mounts, function(r){
    var arr = jp(r.data||'[]', []);
    var sel = $('in-dir'), cur = $('in-dir-custom').value || (state.info && state.info.base_dir) || '';
    sel.innerHTML = '';
    arr.forEach(function(m){
      var o = document.createElement('option');
      o.value = m.path.replace(/\/$/,'') + '/OpenClaw';
      o.textContent = m.path + '  （可用 ' + m.free_mb + ' MB，' + m.dev + '）';
      if (cur && cur.indexOf(m.path) === 0) o.selected = true;
      sel.appendChild(o);
    });
    if (!arr.length){
      var o = document.createElement('option');
      o.value = '/mnt/data/OpenClaw'; o.textContent = '/mnt/data（未检测到外置盘）';
      sel.appendChild(o);
    }

    // 程序目录不再有下拉：它是内部实现细节，固定为 <安装目录>/openclaw
    // （需要分离存放时只能在 SSH 里写 UCI）。安装目录下拉重新生成后重新比对一次。
    dirCheck();
    renderOcdir();
  });
}

function engineOK(nodeNum, engines){
  // mirror of the shell engines_match: supports || and space separated comparators
  if (!engines) return true;
  var parts = engines.split('||');
  for (var i=0;i<parts.length;i++){
    var cmps = parts[i].trim().split(/\s+/), ok = true;
    for (var j=0;j<cmps.length;j++){
      var c = cmps[j]; if (!c) continue;
      if (!cmpOne(nodeNum, c)) { ok = false; break; }
    }
    if (ok) return true;
  }
  return false;
}
function fields(v){ var a=(v||'0.0.0').replace(/^v/,'').split('.'); for(var i=0;i<3;i++){ a[i]=parseInt((a[i]||'0').replace(/[^0-9].*$/,''),10)||0; } return a; }
function cmpOne(v, c){
  if (c===''||c==='*') return true;
  var op = c.match(/^(>=|<=|>|<|=|\^|~)/); op = op ? op[1] : '=';
  var cv = c.replace(/^(>=|<=|>|<|=|\^|~)/,'');
  var a = fields(v), b = fields(cv), raw = cv.split('.');
  for (var i=0;i<3;i++){
    if (raw[i]==='x'||raw[i]==='X'||raw[i]===undefined) break;
    if (a[i]!==b[i]){
      if (op==='>='||op==='>') return a[i]>b[i];
      if (op==='<='||op==='<') return a[i]<b[i];
      return false;
    }
  }
  if (op==='>'||op==='<') return false;
  return true;
}

function loadVersions(refresh){
  get(API.versions + (refresh ? '?refresh=1' : ''), function(r){
    var oc = jp(r.openclaw||'[]', []), nd = jp(r.node||'[]', []);
    state.ocList = oc; state.nodeList = nd;
    var src = jp(r.sources||'{}', {});
    $('in-engines').textContent = '数据源：npm ' + (src.npm||'') + '  |  node ' + (src.node||'') + '  |  ' + (src.arch||'') + (src.musl=='1'?' musl':' glibc');

    var sel = $('in-oc'); sel.innerHTML = '';
    var seen = {};
    oc.slice().reverse().forEach(function(v){
      if (seen[v.version]) return; seen[v.version] = 1;
      var o = document.createElement('option');
      o.value = v.version;
      o.textContent = v.version + (v.tag ? '  [' + v.tag + ']' : '') + '  (node ' + (v.engines||'any') + ')';
      if (v.tag === 'latest') o.selected = true;
      sel.appendChild(o);
    });
    if (!sel.options.length){
      var o = document.createElement('option'); o.value='latest'; o.textContent='latest（在线获取失败，将使用最新稳定版）'; sel.appendChild(o);
    }
    renderNodeOptions();
    // 状态页的「更新 Node」提示与「已有 Node」提示不在这里重绘：
    // 它们属于 openclaw/status 页面，由该页自己的版本请求负责。
  });
}

function currentEngines(){
  var v = $('in-oc').value, e = '';
  state.ocList.forEach(function(x){ if (x.version === v) e = x.engines || ''; });
  return e;
}

function renderNodeOptions(){
  var e = currentEngines();
  var sel = $('in-node'); sel.innerHTML = '';
  var prefer = null;
  state.nodeList.forEach(function(n){
    var ok = engineOK(n.num, e);
    var o = document.createElement('option');
    o.value = n.version;
    o.textContent = n.version + (n.lts ? '  [LTS ' + n.lts + ']' : '') + (ok ? '' : '  ✗ 低于要求 ' + e);
    if (!ok) { o.disabled = true; o.style.color = '#b00'; }
    else if (!prefer) prefer = o;
    sel.appendChild(o);
  });
  if (!sel.options.length){
    var o = document.createElement('option'); o.value='auto'; o.textContent='auto（自动选择满足要求的版本）'; sel.appendChild(o);
  } else if (prefer) { prefer.selected = true; }
  var auto = document.createElement('option'); auto.value='auto'; auto.textContent='auto（自动选择满足要求的最新版本）'; sel.insertBefore(auto, sel.firstChild);
  if (state.info && state.info.node) {
    for (var i=0;i<sel.options.length;i++){ if (sel.options[i].value.replace(/^v/,'v') === state.info.node) sel.options[i].selected = true; }
  }
  var hint = $('in-node-hint');
  hint.innerHTML = '';                       // e comes from the version feed
  hint.appendChild(document.createTextNode('OpenClaw ' + $('in-oc').value + ' 要求 Node.js：'));
  var hb = document.createElement('b'); hb.textContent = e || 'any'; hint.appendChild(hb);
  hint.appendChild(document.createTextNode('　低于该要求的版本已被禁用。'));
}

// 安装与「更新 Node」共用同一条后端安装流程（install-bg），按钮必须一起恢复，
// 否则其中一个会永久停在 disabled。「更新 Node」在本页并不存在（在状态页），
// 用存在性判断保持兼容。
function setInstallButtons(disabled){
  $('btn-install').disabled = disabled;
  if ($('btn-node-update')) $('btn-node-update').disabled = disabled;
}

function logSay(text){
  $('in-log').textContent = text;
  $('in-log').scrollTop = $('in-log').scrollHeight;
}

// 安装结束后把「仍在进行」的接管提示从日志顶部摘掉：提示本身是页面加载时
// 写进去的，光清 state.logHeader 不会让它从已经渲染的文本里消失。
function dropLogHeader(){
  var h = state.logHeader;
  state.logHeader = '';
  if (!h) return;
  var t = $('in-log').textContent || '';
  if (t.indexOf(h + '\n') === 0) $('in-log').textContent = t.slice(h.length + 1);
  else if (t === h) $('in-log').textContent = '';
}

// 安装日志可能很长（node_modules 阶段），done 只需要一个尾巴。
function tailLines(s, n){
  var a = String(s || '').replace(/\s+$/, '').split('\n');
  if (a.length <= n) return a.join('\n');
  return '…（仅显示最后 ' + n + ' 行）\n' + a.slice(a.length - n).join('\n');
}

function startLogPoll(onDone){
  if (state.logTimer) clearInterval(state.logTimer);
  state.logTimer = setInterval(function(){
    get(API.ilog, function(r){
      $('in-log').textContent = (state.logHeader ? state.logHeader + '\n' : '') + (r.log || '（暂无输出）');
      $('in-log').scrollTop = $('in-log').scrollHeight;
    });
    get(API.istatus, function(r){
      var d = jp(r.data||'{}', {});
      if (d.state === 'done' || d.state === 'failed'){
        clearInterval(state.logTimer); state.logTimer = null;
        // 已到终态，「仍在进行」的接管提示不应继续留在顶部。
        dropLogHeader();
        setInstallButtons(false);
        $('in-log').textContent += '\n=== 安装' + (d.state==='done'?'完成':'失败') + ' ===';
        loadInfo(); loadMounts();
        // 调用方（如「使用它」复用本机 Node）可在这里恢复自己的按钮 / 重新探测。
        if (onDone) onDone(d.state);
      }
      // state=lost 说明后台进程已消失且没有完成标记：同样必须停止轮询并恢复按钮，
      // 否则界面会永远显示"正在安装"，用户既看不到原因也无法重试。
      else if (d.state === 'lost'){
        clearInterval(state.logTimer); state.logTimer = null;
        state.logHeader = '';
        setInstallButtons(false);
        logSay('=== 后台安装异常终止 ===\n' + (d.msg || '后端未返回具体原因。')
             + '\n请重新点击「安装」按钮。');
        if (onDone) onDone(d.state);
      }
    });
  }, 2000);
}

// 页面初始化时查一次后台状态：安装可能是上一次启动的（用户刷新过页面、或从别的
// 菜单进来），不接管就永远停在「（尚未开始）」，看起来像根本没在装。
function checkInstallStatusOnLoad(){
  var seq = ++state.istatSeq;
  get(API.istatus, function(r){
    if (seq !== state.istatSeq) return;              // 用户已手动开始安装，放弃这次结果
    if (!r || r.ok === false || !r.data) return;      // 拿不到状态：保持初始文本
    var d = jp(r.data||'{}', {});
    var st = d.state || '';
    var log = d.log || '';

    if (st === 'running'){
      // 日志每 2 秒整段重写，提示必须放进 logHeader 才会一直留在顶部。
      state.logHeader = '检测到后台安装仍在进行，已自动接管进度显示';
      logSay(state.logHeader);
      setInstallButtons(false);                       // 接管期间按钮可点，重复提交由后端拒绝
      startLogPoll();
      return;
    }

    if (st !== 'done' && st !== 'failed' && st !== 'lost') return;

    state.logHeader = '';
    setInstallButtons(false);                         // 终态必须显式恢复（bfcache 会带回 disabled）
    if (st === 'done'){
      var ts = parseInt(d.done_at, 10);
      var when = (ts > 0) ? '（' + fmtTime(ts) + '）' : '';
      logSay('=== 上次安装已完成' + when + ' ===\n'
           + (log ? tailLines(log, 40) : '（日志为空或已被清理）'));
    } else if (st === 'failed'){
      var rc = (d.rc === undefined || d.rc === null || d.rc === '') ? '未知' : String(d.rc);
      logSay('=== 上次安装失败（rc=' + rc + '）===\n'
           + (log || '（日志为空或已被清理）'));
    } else {
      logSay('=== 后台安装异常终止 ===\n' + (d.msg || '后端未返回具体原因。')
           + '\n请重新点击「安装」按钮。');
    }
  });
}

$('in-oc').onchange = renderNodeOptions;
$('btn-reload-versions').onclick = function(){ $('in-engines').textContent='正在在线获取…'; loadVersions(true); };

$('btn-install').onclick = function(){
  var dir = $('in-dir-custom').value.trim() || $('in-dir').value;
  // 程序目录页面上不可编辑，但必须原样回传服务端当前值：save 对 openclaw_dir
  // 是"空值也显式写入"的语义，漏传或传空都会冲掉已有自定义目录。
  var ocdir = normDir(state.ocdirCustom);
  var nd  = $('in-node').value, oc = $('in-oc').value;
  if (!dir) { alert('请选择安装目录'); return; }
  // 目录问题在提交前就拦住，并把"为什么不行、该怎么改"直接告诉用户；
  // 真正的判定仍由后端 save / install 完成（这里只是提示性检查）。
  var chk = dirCheck();
  if (chk.base || chk.ocdir){
    var why = chk.base || chk.ocdir;
    alert('无法继续：' + why);
    $('in-log').textContent = '安装未提交：' + why + '\n';
    return;
  }
  if (nd && nd !== 'auto' && !engineOK(nd.replace(/^v/,''), currentEngines())){
    alert('所选 Node.js ' + nd + ' 不满足 OpenClaw ' + oc + ' 的要求：' + currentEngines());
    return;
  }
  // 程序目录改了要重新安装，且旧目录不会自动清理 —— 先确认
  if (state.savedOcdir !== undefined && state.ocdirCustom !== state.savedOcdir){
    if (!confirm('OpenClaw 程序目录已改动：\n\n'
      + '  原：' + (state.savedOcdir || '（默认，随安装目录）') + '\n'
      + '  新：' + (state.ocdirCustom || '（默认，随安装目录）') + '\n\n'
      + '旧目录不会被自动删除；本次安装会把程序装到新位置。继续？')) return;
  }
  // 先保存设置：save 现在会返回真实结果。目录/端口被安全校验拒绝时
  // 必须停下来提示，否则安装会在后面以难懂的方式失败。
  post(API.save, { base_dir: dir, openclaw_dir: ocdir, oc_version: oc, node_version: nd,
    npm_registry: $('in-registry').value, node_mirror: $('in-nodemirror').value, http_proxy: $('in-proxy').value }, function(sr){
    if (sr && sr.ok === false){
      $('in-log').textContent = '设置保存失败：服务端拒绝了本次配置。请按下面的提示检查对应输入框：\n'
        + '· 安装目录：必须是数据盘上的绝对路径（如 /mnt/<磁盘>/OpenClaw），\n'
        + '  不能是 /etc、/tmp、/var、/overlay、/rom 等系统路径，也不能是符号链接；\n'
        + '· 程序目录：页面不可修改，默认固定为 <安装目录>/openclaw；\n'
        + '  若曾在 SSH 里设过 openclaw_dir，请确认它不等于安装目录、也不是它的上级；\n'
        + '· 端口需在 1025-65535。\n';
      return;
    }
    $('btn-install').disabled = true;
    // 本次是用户主动发起的安装：作废页面初始化时那次状态查询（迟到的响应
    // 不能覆盖下面的「安装已提交」），并清掉可能残留的接管提示。
    state.istatSeq++; state.logHeader = '';
    $('in-log').textContent = '安装已提交，正在准备…\n';
    post(API.install, { base_dir: dir, openclaw_dir: ocdir, oc_version: oc, node_version: nd }, function(r){
      if (!r || r.ok === false){
        $('btn-install').disabled = false;
        $('in-log').textContent = '安装启动失败：' + ((r && (r.data || r.error)) || '服务无响应，请重试') + '\n';
        return;
      }
      $('in-log').textContent = '安装已启动，日志如下：\n';
      startLogPoll();
    });
  });
};

$('btn-uninstall').onclick = function(){
  if (!confirm('将删除 OpenClaw 与 Node.js 运行时（保留配置数据），继续？')) return;
  post(API.service, { action: 'stop' }, function(){});
  var x = new XMLHttpRequest();
  x.open('POST', '<%=luci.dispatcher.build_url("admin","services","openclaw","api","run")%>', true);
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.send('cmd=uninstall');
  setTimeout(function(){ loadInfo(); }, 3000);
};

$('btn-save').onclick = function(){
  post(API.save, { port: $('cfg-port').value, bind: $('cfg-bind').value, enabled: $('cfg-enabled').value },
    function(r){
      if (!r || r.ok === false){
        alert('保存失败：' + ((r && (r.data || r.error)) || '服务无响应，请检查端口（1025-65535）后重试'));
        return;
      }
      alert('已保存');
      setTimeout(loadInfo, 2000);
    });
};
$('in-dir').onchange = function(){ $('in-dir-custom').value = $('in-dir').value; dirCheck(); renderOcdir(); };
// 安装目录变化时「程序位置」要跟着变：默认值 <安装目录>/openclaw 由它推导
$('in-dir-custom').oninput = function(){ dirCheck(); renderOcdir(); };

// 恢复默认：清掉内存里的自定义程序目录，保存 / 安装时随请求回传空串
$('btn-ocdir-reset').onclick = function(){
  state.ocdirCustom = '';
  renderOcdir();
  var base = normDir($('in-dir-custom').value || $('in-dir').value);
  setHint('in-ocdir-msg', '已恢复默认，安装时会装到 ' + (base ? base + '/openclaw' : '<安装目录>/openclaw'));
};

// fmtTime：设置页的 checkInstallStatusOnLoad 需要显示「上次安装完成于 …」。
// 备份 / 恢复已拆到独立页面（openclaw/backup.htm），那边自带一份。
function fmtTime(ts){
  if (!ts) return '-';
  var d = new Date(ts * 1000);
  var p = function(x){ return (x<10?'0':'') + x; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' '
       + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}


loadInfo();
// 安装可能是上一次启动的（刷新页面 / 从别的菜单进来）：必须主动接管进度，
// 否则日志区会一直停在「（尚未开始）」，看起来像根本没在装。
checkInstallStatusOnLoad();
loadMounts();
loadVersions(false);
</script>
